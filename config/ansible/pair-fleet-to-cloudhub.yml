---
# Joins every bot and hub to this fleet's CloudHub VPN, over the fleet WLAN from the
# hub this runs on. Open fleet pairing first - from the CloudHub's own JCU if no hub
# is on the VPN yet - or the CloudHub will turn the nodes away.
#
# Safe to run on a fleet that is already paired: a node whose tunnel still reaches the
# CloudHub pairs nothing again. One whose tunnel has gone quiet - the CloudHub was
# replaced - pairs again with the bootstrap key in its own fleet config. A node
# switched off is reported and skipped.
- name: Pair fleet to CloudHub
  hosts: "bots:hubs:!hub30-*"
  become: yes
  gather_facts: no
  ignore_unreachable: yes
  tasks:
    - name: Pair this node with the CloudHub
      # A node imaged before the script was packaged still has only the copy its image carried
      shell: |
        if [ -x /usr/bin/jaia-pair-with-cloudhub.sh ]; then
            exec /usr/bin/jaia-pair-with-cloudhub.sh
        fi
        exec /etc/jaiabot/init/pair-with-cloudhub.sh
      register: pairing
      changed_when: "'Paired with' in pairing.stdout"

    - name: Display the result
      debug:
        msg: "{{ pairing.stdout_lines | last | default('') }}"
