---
- name: Change the enabled communications links (modems)
  hosts: all
  become: yes
  gather_facts: no
  vars:
    known_links: [xbee, wifi, iridium]
    requested_links: "{{ (comms_link | default('')).split(',') | map('trim') | reject('equalto', '') | list }}"
  pre_tasks:
    - name: Check comms_link is one or more known links, in any order
      ansible.builtin.assert:
        that:
          - requested_links | length > 0
          - requested_links | difference(known_links) | length == 0
          - requested_links | unique | length == requested_links | length
        fail_msg: "Invalid comms_link '{{ comms_link | default('') }}': give one or more of {{ known_links | join(', ') }}, comma separated"
  tasks:
    - name: Set new comms_link debconf
      debconf:
        name: jaiabot_embedded
        question: "jaiabot-embedded/comms_links"
        value: "{{ comms_link }}"
        vtype: "multiselect"

    - name: Reconfigure package
      command: /usr/bin/jaia-debconf.sh reconfigure

    - name: Restart JaiaBot services
      command: systemctl restart jaiabot
