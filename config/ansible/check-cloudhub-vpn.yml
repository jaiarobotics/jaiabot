---
# Whether this hub is linked to its CloudHub. A view, not a change - and of this
# hub alone, matching change-cloudhub-vpn.yml. Also offered on the CloudHub, where
# it reports the server end and the nodes paired with it.
- name: Check this hub's CloudHub VPN state
  hosts: all
  connection: local
  become: yes
  gather_facts: no
  tasks:
    - include_tasks: tasks/read-debconf.yml

    - name: Find whether this is the CloudHub, the server end of the VPN
      stat:
        path: /etc/wireguard/wg_cloudhub.conf
      register: cloudhub_server

    - name: Choose this hub's end of the CloudHub VPN
      set_fact:
        cloudhub_vpn_iface: "{{ 'wg_cloudhub' if cloudhub_server.stat.exists else 'wg_jaia_ch' ~ jaiabot_embedded_fleet_id }}"

    - name: Get current CloudHub VPN active state
      shell: "systemctl is-active wg-quick@{{ cloudhub_vpn_iface }} | awk '{print $1}'"
      register: vpn_active_state
      failed_when: false
      changed_when: false

    - name: Get current CloudHub VPN enable state
      shell: "systemctl is-enabled wg-quick@{{ cloudhub_vpn_iface }} | awk '{print $1}'"
      register: vpn_enable_state
      failed_when: false
      changed_when: false

    - name: List the nodes paired with the CloudHub and their last handshake
      command: jaia-vpn-peers.sh status wg_cloudhub
      register: vpn_peers
      changed_when: false
      when: cloudhub_server.stat.exists

    - name: Set facts for CloudHub VPN status
      set_fact:
        cloudhub_vpn_active_state: "{{ vpn_active_state.stdout }}"
        cloudhub_vpn_enable_state: "{{ vpn_enable_state.stdout }}"
        cloudhub_vpn_peers: "{{ (vpn_peers.stdout_lines | join(', ')) or 'none' if cloudhub_server.stat.exists else 'shown on the CloudHub' }}"

    - name: Display current CloudHub VPN active state
      debug:
        var: cloudhub_vpn_active_state

    - name: Display current CloudHub VPN enable state
      debug:
        var: cloudhub_vpn_enable_state

    - name: Display the paired nodes
      debug:
        var: cloudhub_vpn_peers
