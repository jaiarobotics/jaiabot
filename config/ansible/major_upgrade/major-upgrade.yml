---
# Tasks for hub only
- name: Jaiabot major upgrade - Hub staging
  hosts: hubs
  gather_facts: yes
  become: yes
  vars_files:
    - vars/staging.yml

  pre_tasks:
    - include_tasks: tasks/set-error-fact.yml
    - include_tasks: tasks/check-hub-id.yml
      
    - name: Create the staging directory
      file:
        path: '{{ hub_staging_dir }}'
        state: directory
  
    - include_tasks: ../tasks/read-debconf.yml

  tasks:
    - include_tasks: tasks/hub-clear-known-hosts.yml
    - include_tasks: tasks/hub-mount-updates-disk.yml
    - include_tasks: tasks/set-fleet-config-facts.yml
    - include_tasks: tasks/hub-stage-fleet-config.yml
    - include_tasks: tasks/hub-check-ssh-key.yml
      
# Tasks for all bots and hub
- name: Jaiabot major upgrade - Upgrade all
  hosts: all
  become: yes
  gather_facts: yes
  vars_files:
    - vars/disk-space.yml
    - vars/staging.yml
  vars:
    - upgrade_dir_base: '/var/log/jaiabot/major_upgrade'
    - do_backup: yes
      
  pre_tasks:
    - include_tasks: tasks/set-error-fact.yml
    - include_tasks: tasks/check-hub-id.yml
    - include_tasks: ../tasks/read-debconf.yml
      
    - name: Create the upgrade base working directory
      file:
        path: '{{ upgrade_dir_base }}'
        state: directory
        
  tasks:
    - include_tasks: ../tasks/get-version.yml
    - include_tasks: tasks/check-latest-minor-version-installed.yml
    - include_tasks: tasks/get-major-version.yml
    - include_tasks: tasks/check-versions.yml
    - include_tasks: tasks/directory_creation.yml
    - include_tasks: tasks/check-disk-space.yml
    - include_tasks: tasks/get-new-filesystems.yml
    - include_tasks: tasks/set-fleet-config-facts.yml
    - include_tasks: tasks/copy-fleet-config.yml
    - include_tasks: tasks/fetch-reuse-files.yml
    - include_tasks: tasks/backup-old-rootfs-overlay.yml
    - include_tasks: tasks/prepare-boot-fs.yml
    - include_tasks: tasks/generate-upgrade-script.yml

    # Nohup so we complete the ansible job and get to the reboot splash screen before the crazy happens
    - name: Run upgrade script
      shell: |
        nohup /bin/bash -c 'sleep 5 && {{ upgrade_dir }}/do-major-upgrade.sh > {{ upgrade_dir }}/major_upgrade_final.log 2>&1 &' > /dev/null

    - name: Set error to success
      set_fact:
        major_upgrade_error: "No error"
