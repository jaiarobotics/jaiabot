---
# Tasks for hub only - staging
- name: Jaiabot major upgrade - Hub staging
  hosts: hubs
  gather_facts: yes
  become: yes
  vars_files:
    - vars/staging.yml

  pre_tasks:
    - include_tasks: tasks/set-error-fact.yml
    - include_tasks: tasks/check-hub-id.yml

    - name: Create the staging directory
      file:
        path: '{{ hub_staging_dir }}'
        state: directory

    - include_tasks: ../tasks/read-debconf.yml

    # the other hubs are upgraded from this one's updates disk in the next play
    - name: Stage only on the hub with the updates disk
      meta: end_host
      when: jaiabot_embedded_hub_id | int != hub_id | int

  tasks:
    - include_tasks: tasks/hub-detect-cloudhub.yml

    - name: Take the image from S3 when there is no updates disk to take it from
      include_tasks: tasks/hub-fetch-iso.yml
      when: is_cloudhub | bool or major_upgrade_iso is defined

    - include_tasks: tasks/hub-mount-updates-disk.yml
      when: not (is_cloudhub | bool or major_upgrade_iso is defined)

    - include_tasks: tasks/set-fleet-config-facts.yml
    - include_tasks: tasks/hub-stage-fleet-config.yml
    - include_tasks: tasks/hub-check-fleet-config.yml
    - include_tasks: tasks/hub-check-ssh-key.yml

    # after the migration above, so the other nodes get the config the new release wrote
    - name: Fetch the migrated fleet config to the controller
      fetch:
        src: '{{ staged_fleet_cfg }}'
        dest: '{{ controller_fleet_cfg }}'
        flat: yes

    - name: Keep the fetched fleet config private
      file:
        path: '{{ controller_fleet_cfg }}'
        mode: '0600'
      delegate_to: localhost
      become: no

# Tasks for all bots and hub
- name: Jaiabot major upgrade - Upgrade all
  hosts: all
  become: yes
  gather_facts: yes
  vars_files:
    - vars/disk-space.yml
    - vars/staging.yml
  vars:
    do_backup: yes
    # VirtualFleet machines run the AMI of the release being left behind and nothing
    # upgrades them, so they go with it unless asked otherwise
    delete_virtualfleet: yes

  pre_tasks:
    - include_tasks: tasks/set-error-fact.yml
    - include_tasks: tasks/check-hub-id.yml
    - include_tasks: ../tasks/read-debconf.yml
    - include_tasks: tasks/hub-detect-cloudhub.yml

    - name: Clear the VirtualFleet this CloudHub owns
      include_tasks: tasks/hub-delete-virtualfleet.yml
      when: is_cloudhub | bool and delete_virtualfleet | bool

    - name: Create the upgrade base working directory
      file:
        path: '{{ upgrade_dir_base }}'
        state: directory

  tasks:
    - name: Run Major Upgrade with Hub cleanup
      block:
        - include_tasks: tasks/check-imu-type.yml
        - include_tasks: ../tasks/get-version.yml
        - include_tasks: tasks/check-latest-minor-version-installed.yml
        - include_tasks: tasks/get-major-version.yml
        - include_tasks: tasks/check-versions.yml
        - include_tasks: tasks/directory_creation.yml
        - include_tasks: tasks/check-disk-space.yml

          # only once the checks pass, so a node that is not upgraded (e.g. one already upgraded from another hub) keeps running
        - name: Stop Jaiabot
          shell: |
            systemctl stop jaiabot

        - include_tasks: tasks/get-new-filesystems.yml
        - include_tasks: tasks/set-fleet-config-facts.yml
        - include_tasks: tasks/copy-fleet-config.yml
        - include_tasks: tasks/fetch-reuse-files.yml
        - include_tasks: tasks/backup-old-rootfs-overlay.yml
        - include_tasks: tasks/prepare-boot-fs.yml
        - include_tasks: tasks/generate-upgrade-script.yml
          # Nohup so we complete the ansible job and get to the reboot splash screen before the crazy happens
        - name: Run upgrade script
          shell: |
            nohup /bin/bash -c 'sleep 15 && {{ upgrade_dir }}/do-major-upgrade.sh > {{ upgrade_dir }}/major_upgrade_final.log 2>&1 &' > /dev/null

        - name: Set error to success
          set_fact:
            major_upgrade_error: "No error: please wait for all systems to complete upgrade before powering off. Once you hear the startup chime, the major upgrade is complete. This process may take another 10-30 minutes to complete."
      always:
        # we want to clear the hub known hosts if any bots succeed, so we can still connect to the new machines after upgrade.
        - name: Clear known hosts on Hub
          include_tasks: tasks/hub-clear-known-hosts.yml
          when: inventory_hostname.startswith('hub')
