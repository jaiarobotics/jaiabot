# Runs the fleet config tool of the release being installed (from its boot
# tarball on the updates disk), so the schema, migrations and first-boot template
# always match; the hub's installed jaia may be older than the fleet config
# find rather than the fileglob lookup, which searches the controller instead of the hub
- name: Look for the new release's boot tarball
  find:
    paths: /var/www/html/updates/major_upgrade
    patterns: '*.boot.tar.gz'
  register: upgrade_boot_tar_found

- name: Set facts for the new release's fleet config tool
  set_fact:
    upgrade_boot_tar: "{{ upgrade_boot_tar_found.files | map(attribute='path') | first | default('') }}"
    fleet_config_tool_dir: "{{ hub_staging_dir }}/fleet_config"

- name: Handle missing boot tarball
  include_tasks: handle_failure.yml
  vars:
    error_message: "No boot image found on the updates disk: Ensure the correct jaiabot_updates ISO is installed in the hub."
  when: upgrade_boot_tar == ''

- name: Extract the fleet config tool from the new boot tarball
  shell: |
    rm -rf {{ fleet_config_tool_dir }}
    mkdir -p {{ fleet_config_tool_dir }}
    tar -xzf {{ upgrade_boot_tar }} -C {{ fleet_config_tool_dir }} --wildcards '*jaiabot/init/fleet_config/*'
    tool=$(find {{ fleet_config_tool_dir }} -name jaia-fleet-config.py | head -1)
    if [ -z "${tool}" ]; then
      echo "The boot image carries no fleet config tool"
      exit 1
    fi
    echo "${tool}"
  register: fleet_config_tool_result

- name: Set fleet config tool path
  set_fact:
    fleet_config_tool: "{{ fleet_config_tool_result.stdout_lines[-1] }}"

- name: Migrate and validate the staged fleet config with the new release's tool
  shell: |
    python3 {{ fleet_config_tool }} migrate {{ staged_fleet_cfg }} -o {{ staged_fleet_cfg }}
  register: fleet_config_migrate_result
  ignore_errors: yes

- name: Handle fleet config migration failure
  include_tasks: handle_failure.yml
  vars:
    error_message: "Fleet configuration cannot be used with the new release: {{ fleet_config_migrate_result.stderr | default(fleet_config_migrate_result.stdout) }}"
  when: fleet_config_migrate_result.failed

# The operator says what the fleet is; the config says what it was built as. A
# disagreement means one of them is wrong, and upgrading on the wrong answer
# either strands a CloudHub or expects one that was never there.
- name: Ask the new release's tool whether this fleet has a CloudHub
  shell: |
    python3 {{ fleet_config_tool }} has_cloudhub {{ staged_fleet_cfg }}
  register: fleet_config_has_cloudhub
  changed_when: false

- name: Handle a fleet config that disagrees about the CloudHub
  include_tasks: handle_failure.yml
  vars:
    error_message: >-
      You answered has_cloudhub={{ has_cloudhub | default('yes') }}, but the fleet
      configuration describes a fleet {{ 'without' if fleet_config_has_cloudhub.stdout_lines[-1] == 'no' else 'with' }}
      a CloudHub. Correct the answer, or the fleet config with 'jaia admin fleet edit'.
  when: fleet_config_has_cloudhub.stdout_lines[-1] != (has_cloudhub | default('yes'))
