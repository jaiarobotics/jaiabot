# Runs the fleet config tool of the release being installed (from its boot
# tarball on the updates disk), so the schema, migrations and first-boot template
# always match; the hub's installed jaia may be older than the fleet config
- name: Set facts for the new release's fleet config tool
  set_fact:
    upgrade_boot_tar: "{{ lookup('fileglob', '/var/www/html/updates/major_upgrade/*.boot.tar.gz') }}"
    fleet_config_tool_dir: "{{ hub_staging_dir }}/fleet_config"

- name: Handle missing boot tarball
  include_tasks: handle_failure.yml
  vars:
    error_message: "No boot image found on the updates disk: Ensure the correct jaiabot_updates ISO is installed in the hub."
  when: upgrade_boot_tar == ''

- name: Extract the fleet config tool from the new boot tarball
  shell: |
    rm -rf {{ fleet_config_tool_dir }}
    mkdir -p {{ fleet_config_tool_dir }}
    tar -xzf {{ upgrade_boot_tar }} -C {{ fleet_config_tool_dir }} --wildcards '*jaiabot/init/fleet_config/*'
    tool=$(find {{ fleet_config_tool_dir }} -name jaia-fleet-config.py | head -1)
    if [ -z "${tool}" ]; then
      echo "The boot image carries no fleet config tool"
      exit 1
    fi
    echo "${tool}"
  register: fleet_config_tool_result

- name: Set fleet config tool path
  set_fact:
    fleet_config_tool: "{{ fleet_config_tool_result.stdout_lines[-1] }}"

- name: Migrate and validate the staged fleet config with the new release's tool
  shell: |
    python3 {{ fleet_config_tool }} migrate {{ staged_fleet_cfg }} -o {{ staged_fleet_cfg }}
  register: fleet_config_migrate_result
  ignore_errors: yes

- name: Handle fleet config migration failure
  include_tasks: handle_failure.yml
  vars:
    error_message: "Fleet configuration cannot be used with the new release: {{ fleet_config_migrate_result.stderr | default(fleet_config_migrate_result.stdout) }}"
  when: fleet_config_migrate_result.failed

# A hub's own copy is written at first boot and when a hub is paired, but not when
# a bot is, so it can miss nodes its inventory lists. Every node is rebuilt from
# the staged config, so one that is missing a node must come from the ISO instead.
- name: Ask the new release's tool which hubs and bots the fleet config lists
  shell: |
    python3 {{ fleet_config_tool }} nodes {{ staged_fleet_cfg }}
  register: fleet_config_nodes
  changed_when: false
  failed_when: false
  when: not iso_fleet_file.stat.exists

# An image built before the tool could list nodes still upgrades, as it did before
- name: Warn that this image cannot check the hub's fleet config
  debug:
    msg: >-
      This update image's fleet config tool cannot list a config's nodes, so the hub's own
      fleet configuration is used without checking it against the inventory. Make sure it
      lists every hub and bot, or embed the current one with 'jaia admin fleet update_iso'.
  when: not iso_fleet_file.stat.exists and fleet_config_nodes.rc != 0 and 'invalid choice' in fleet_config_nodes.stderr

- name: Handle a fleet config the new release's tool cannot list
  include_tasks: handle_failure.yml
  vars:
    error_message: "Could not read the hubs and bots in the fleet configuration: {{ fleet_config_nodes.stderr }}"
  when: not iso_fleet_file.stat.exists and fleet_config_nodes.rc != 0 and 'invalid choice' not in fleet_config_nodes.stderr

- name: Compare the hub's inventory with its fleet config
  set_fact:
    inventory_node_ids:
      hubs: "{{ groups['hubs'] | default([]) | select('match', '^hub[0-9]+-') | map('regex_replace', '^hub([0-9]+)-.*$', '\\1') | map('int') | sort }}"
      bots: "{{ groups['bots'] | default([]) | select('match', '^bot[0-9]+-') | map('regex_replace', '^bot([0-9]+)-.*$', '\\1') | map('int') | sort }}"
    fleet_config_node_ids:
      hubs: "{{ (fleet_config_nodes.stdout_lines | select('match', '^hubs') | first).split()[1:] | map('int') | sort }}"
      bots: "{{ (fleet_config_nodes.stdout_lines | select('match', '^bots') | first).split()[1:] | map('int') | sort }}"
  when: not iso_fleet_file.stat.exists and fleet_config_nodes.rc == 0

- name: Handle a hub fleet config that does not match its inventory
  include_tasks: handle_failure.yml
  vars:
    error_message: >-
      This hub's inventory lists hubs {{ inventory_node_ids.hubs | join(', ') }} and bots
      {{ inventory_node_ids.bots | join(', ') }}, but its own fleet configuration lists hubs
      {{ fleet_config_node_ids.hubs | join(', ') }} and bots {{ fleet_config_node_ids.bots | join(', ') }},
      so it may be out of date. Write the fleet's current configuration onto the update image
      with 'jaia admin fleet update_iso', attach it to this hub, and run the upgrade again.
  when: not iso_fleet_file.stat.exists and fleet_config_nodes.rc == 0 and inventory_node_ids != fleet_config_node_ids

# The operator says what the fleet is; the config says what it was built as. A
# disagreement means one of them is wrong, and upgrading on the wrong answer
# either strands a CloudHub or expects one that was never there.
- name: Ask the new release's tool whether this fleet has a CloudHub
  shell: |
    python3 {{ fleet_config_tool }} has_cloudhub {{ staged_fleet_cfg }}
  register: fleet_config_has_cloudhub
  changed_when: false

- name: Handle a fleet config that disagrees about the CloudHub
  include_tasks: handle_failure.yml
  vars:
    error_message: >-
      You answered has_cloudhub={{ has_cloudhub | default('yes') }}, but the fleet
      configuration describes a fleet {{ 'without' if fleet_config_has_cloudhub.stdout_lines[-1] == 'no' else 'with' }}
      a CloudHub. Correct the answer, or the fleet config with 'jaia admin fleet edit'.
  when: fleet_config_has_cloudhub.stdout_lines[-1] != (has_cloudhub | default('yes'))
