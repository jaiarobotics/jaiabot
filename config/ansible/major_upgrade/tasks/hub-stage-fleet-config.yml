- name: Set facts for existing and iso fleet configuration
  set_fact:
    iso_fleet_cfg: "/var/www/html/updates/major_upgrade/fleet{{ jaiabot_embedded_fleet_id }}.cfg"
    existing_fleet_cfg: "/etc/jaiabot/fleet{{ jaiabot_embedded_fleet_id }}.cfg"

- name: Stage the fleet config given on the command line
  copy:
    src: "{{ fleet_cfg }}"
    dest: "{{ hub_staging_dir }}/fleet{{ jaiabot_embedded_fleet_id }}.cfg"
    remote_src: yes
  when: fleet_cfg is defined

# A CloudHub has no USB key or CD to carry it, so "jaia admin fleet cloudhub
# prep_major_upgrade" leaves it in the data bucket. The offload mount names the
# bucket and its region on both 2.y and 3.y.
- name: Fetch the fleet config left in the CloudHub's data bucket
  shell: |
    mount=$(awk '$2 == "/var/log/jaiabot/bot_offload/" && $3 == "fuse.s3fs"' /etc/fstab | head -1)
    bucket=$(echo "${mount}" | awk '{ print $1 }')
    region=$(echo "${mount}" | sed -n 's|.*url=https://s3\.\([^.]*\)\.amazonaws\.com.*|\1|p')
    aws s3 cp ${region:+--region "${region}"} \
        "s3://${bucket:-jaia--cloudhub-data--fleet{{ jaiabot_embedded_fleet_id }}}/jaia/major_upgrade/fleet{{ jaiabot_embedded_fleet_id }}.cfg" \
        "{{ hub_staging_dir }}/fleet{{ jaiabot_embedded_fleet_id }}.cfg"
  register: bucket_fleet_cfg
  failed_when: false
  changed_when: bucket_fleet_cfg.rc == 0
  when: fleet_cfg is not defined and is_cloudhub | default(false) | bool

- name: Set whether the data bucket supplied the fleet config
  set_fact:
    bucket_fleet_cfg_staged: "{{ bucket_fleet_cfg.rc | default(1) == 0 }}"

- name: Check if the iso fleet config file exists
  stat:
    path: "{{ iso_fleet_cfg }}"
  register: iso_fleet_file
  when: fleet_cfg is not defined and not bucket_fleet_cfg_staged | bool

- name: Check if the existing fleet config file exists
  stat:
    path: "{{ existing_fleet_cfg }}"
  register: existing_fleet_file
  when: fleet_cfg is not defined and not bucket_fleet_cfg_staged | bool and not iso_fleet_file.stat.exists

- name: Stage the iso fleet config file if it exists
  copy:
    src: "{{ iso_fleet_cfg }}"
    dest: "{{ hub_staging_dir }}"
    remote_src: yes
  when: fleet_cfg is not defined and not bucket_fleet_cfg_staged | bool and iso_fleet_file.stat.exists

- name: Stage the existing fleet config file if the iso config does not exist
  copy:
    src: "{{ existing_fleet_cfg }}"
    dest: "{{ hub_staging_dir }}"
    remote_src: yes
  when: fleet_cfg is not defined and not bucket_fleet_cfg_staged | bool and not iso_fleet_file.stat.exists and existing_fleet_file.stat.exists

- name: Note where the staged fleet config came from
  set_fact:
    staged_fleet_cfg_source: "{{ 'command line' if fleet_cfg is defined else ('cloudhub data bucket' if bucket_fleet_cfg_staged | bool else ('iso' if iso_fleet_file.stat.exists else 'hub')) }}"

- name: Handle fleet config failure
  include_tasks: handle_failure.yml
  vars:
    error_message: >-
      {{ ('Failed to find fleet configuration: run "jaia admin fleet cloudhub prep_major_upgrade fleetN.cfg"
      from a workstation with AWS credentials first. Fetching it from the data bucket gave: '
      ~ (bucket_fleet_cfg.stderr | default('') | trim))
      if is_cloudhub | default(false) | bool else
      'Failed to find fleet configuration: Please contact JaiaRobotics for a USB key or CD with an embedded fleet configuration.' }}
  when: fleet_cfg is not defined and not bucket_fleet_cfg_staged | bool and not iso_fleet_file.stat.exists and not existing_fleet_file.stat.exists
