- name: Check that architecture matches
  shell: |
    current_arch=$(dpkg --print-architecture)
    major_upgrade_arch="{{major_upgrade_arch}}"
    if [ "${major_upgrade_arch}" = "${current_arch}" ]; then
      echo "Major upgrade architecture matches existing system architecture (${major_upgrade_arch} = ${current_arch})"
    else
      echo "Major upgrade architecture does not match existing system architecture (${major_upgrade_arch} != ${current_arch})"
      return 1
    fi
        
- name: Check that Ubuntu version is greater than current version
  shell: |
    current_ubuntu_version=$(grep VERSION_ID /etc/os-release | cut -d '"' -f 2)
    if ! dpkg --compare-versions {{ major_upgrade_ubuntu_version }} gt ${current_ubuntu_version} ; then
    echo "New Ubuntu version ({{ major_upgrade_ubuntu_version }}) is not greater than current version (${current_ubuntu_version})"
      return 1
    fi
  register: ubuntu_version_check_result
  ignore_errors: yes

- name: Handle Ubuntu version check failure
  include_tasks: handle_failure.yml
  vars:
    error_message: "No major upgrade to perform: current Ubuntu version is same as new version."
  when: ubuntu_version_check_result.failed
  
- name: Debug version
  debug:
    msg: "Found major upgrade version: {{ major_upgrade_version }}, current version: {{ jaiabot_current_version }}"
        
- name: Check that upgrade version is greater than or equal to than current version
  shell: |
    if ! dpkg --compare-versions {{ major_upgrade_version }} ge $(echo {{ jaiabot_current_version }} | cut -d '-' -f1) ; then
    echo "New major version ({{ major_upgrade_version }}) is not greater than or equal to current version ({{ jaiabot_current_version }})"
      return 1
    fi
  register: major_upgrade_version_check_result
  ignore_errors: yes

- name: Handle Jaiabot major version check failure
  include_tasks: handle_failure.yml
  vars:
    error_message: "No major upgrade to perform: current jaiabot version is greater than new version."
  when: major_upgrade_version_check_result.failed

- name: Install rpi-eeprom package
  apt:
    name: rpi-eeprom
    state: present
  ignore_errors: yes
  register: rpi_eeprom_install_result

- name: Check Raspberry Pi 4 EEPROM version
  shell: |
    min_version=1669373653
    current_version=$(rpi-eeprom-update 2>/dev/null | grep -oP 'CURRENT:\s+\K\S+' | head -1)
    if [ -z "${current_version}" ]; then
      echo "Could not determine EEPROM version"
      return 1
    fi
    if [ "${current_version}" -lt "${min_version}" ]; then
      echo "Raspberry Pi 4 EEPROM version must be at least ${min_version} (2022-11-25) to continue (version: ${current_version})"
      return 1
    fi
  register: eeprom_version_check_result
  ignore_errors: yes
  when: rpi_eeprom_install_result is not failed

- name: Handle EEPROM version check failure
  include_tasks: handle_failure.yml
  vars:
    error_message: "{{ eeprom_version_check_result.stdout }}"
  when: >
    (rpi_eeprom_install_result is failed) or
    (eeprom_version_check_result is not skipped and eeprom_version_check_result.failed)
