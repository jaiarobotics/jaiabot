## Pre-declare environmental variables
environment-template-common: &environment-template-common
  DEBIAN_FRONTEND: "noninteractive"
  DEBIAN_PRIORITY: "critical"
  DEBCONF_NOWARNINGS: "yes"
  DEBFULLNAME: "JaiaRobotics CircleCI"
  DEBEMAIL: "toby@gobysoft.org"
  QUILT_PATCHES: debian/patches
  QUILT_REFRESH_ARGS: "-p ab --no-timestamps --no-index --strip-trailing-whitespace"
  CC: /usr/bin/clang
  CXX: /usr/bin/clang++
  # set to "true" to build jaiabot-doc/jaiabot-interfaces (and run goby_clang_tool) even when JAIABOT_APT_REPO is "test"
  BUILD_DOC_FOR_TEST_REPO: "false"
  # set to "true" to compile test-repo builds at -O0 (via the "noopt" DEB_BUILD_OPTIONS flag) for faster
  # iteration; default keeps full -O2 optimization since test-repo packages may be installed on real hardware
  DISABLE_OPT_FOR_TEST_REPO: "false"
  CCACHE_DIR: /root/.ccache
  CCACHE_MAXSIZE: "3G"
  # each job starts from a fresh container, so both mtime (default) and hashing the compiler's
  # raw content are unstable: apt-get dist-upgrade can pull a same-version compiler rebuild with
  # different bytes, invalidating every cache entry at once. Check the reported version string
  # instead, which is stable across same-version rebuilds and only changes on a real upgrade.
  CCACHE_COMPILERCHECK: "%compiler% -v"
  # fixed, build-directory-independent location webpack.config.js will use for its filesystem cache when set
  WEBPACK_CACHE_DIR: /root/.cache/webpack

environment-template-amd64: &environment-template-amd64
  TARGET_ARCH: "amd64"
  DEB_BUILD_OPTIONS: "parallel=4"
  # one job only must do the source build for each distro
  DO_SOURCE_BUILD: "true"

environment-template-arm64: &environment-template-arm64
  TARGET_ARCH: "arm64"
  DEB_BUILD_OPTIONS: "parallel=4 nocheck"

environment-template-resolute: &environment-template-resolute
  DISTRO_RELEASE_CODENAME: "resolute"
  DISTRO_RELEASE_VERSION: "ubuntu26.04"

## Pre-declare Docker containers
docker-base-resolute: &docker-base-resolute
  - image: gobysoft/jaiabot-ubuntu-amd64:26.04
    auth:
      username: $DOCKERHUB_USERNAME
      password: $DOCKERHUB_PASSWORD
docker-arm64-resolute: &docker-arm64-resolute
  - image: gobysoft/jaiabot-ubuntu-arm64:26.04
    auth:
      username: $DOCKERHUB_USERNAME
      password: $DOCKERHUB_PASSWORD

docker-base-light: &docker-base-light
  - image: gobysoft/ubuntu-build-base:26.04.1
    auth:
      username: $DOCKERHUB_USERNAME
      password: $DOCKERHUB_PASSWORD

## Pre-declare job templates
job-template-amd64: &job-template-amd64
  resource_class: large
  working_directory: /root/jaiabot
  steps:
    - checkout
    - run: &run-submodule-sync
        name: Sync git submodules
        command: git submodule sync
    - run: &run-submodule-update
        name: Update git submodules
        command: git submodule update --init --recursive
    - restore_cache: &restore-ccache
        keys:
          - jaiabot-ccache-v1-{{ .Environment.CIRCLE_JOB }}-{{ .Branch }}-{{ .Revision }}
          - jaiabot-ccache-v1-{{ .Environment.CIRCLE_JOB }}-{{ .Branch }}-
          - jaiabot-ccache-v1-{{ .Environment.CIRCLE_JOB }}-
    - run: &run-set-deb-rep-and-version
        name: Set environmental variables for which packages.jaia.tech repo to use
        command: |
          repo=$(${CIRCLE_WORKING_DIRECTORY}/.circleci/deb_repo.sh "$CIRCLE_BRANCH" "$CIRCLE_TAG" "repo")
          version=$(${CIRCLE_WORKING_DIRECTORY}/.circleci/deb_repo.sh "$CIRCLE_BRANCH" "$CIRCLE_TAG" "version")
          # export these for later use
          echo "export JAIABOT_APT_REPO=${repo}" >> $BASH_ENV
          echo "export JAIABOT_APT_VERSION=${version}" >> $BASH_ENV
    - run: &run-add-jaia-packages-list
        name: Add correct packages.jaia.tech sources.list
        command: |
          echo "JAIABOT_APT_REPO=${JAIABOT_APT_REPO}"
          echo -e "deb [signed-by=/etc/apt/keyrings/jaiabot.gpg] http://packages.jaia.tech/ubuntu/${JAIABOT_APT_REPO}/${JAIABOT_APT_VERSION}/ ${DISTRO_RELEASE_CODENAME}/\ndeb [signed-by=/etc/apt/keyrings/gobysoft.gpg] http://packages.jaia.tech/ubuntu/gobysoft/${JAIABOT_APT_REPO}/${JAIABOT_APT_VERSION}/ ${DISTRO_RELEASE_CODENAME}/" >> /etc/apt/sources.list.d/jaiabot_${JAIABOT_APT_REPO}_${JAIABOT_APT_VERSION}.list
    - run: &run-update-apt
        name: Update apt packages
        command: |
          apt-get update &&
          apt-get dist-upgrade -y &&
          apt-get install -y ccache python3-venv
          [[ "${TARGET_ARCH}" == "amd64" && ( "${JAIABOT_APT_REPO}" != "test" || "${BUILD_DOC_FOR_TEST_REPO}" == "true" ) ]] && apt-get install -y goby3-clang-tool || true
    - run: &run-zero-ccache-stats
        name: Reset ccache statistics
        # the counters live in the cache directory, so without this they accumulate
        # across every build that restores the cache
        command: ccache -z || true
    - run: &run-build
        name: Build
        # the web UI is built by amd64-resolute-web-build instead: webpack alongside
        # four concurrent clang jobs exceeds the container's memory
        command: mkdir -p build && cd build && cmake -DCMAKE_BUILD_TYPE=Debug -Denable_testing=ON -Dbuild_web=OFF -Dbuild_jdv=OFF -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache .. && cmake --build . -- -j4
    - run: &show-ccache-stats
        name: Show ccache stats
        command: ccache -s || true
    - save_cache: &save-ccache
        key: jaiabot-ccache-v1-{{ .Environment.CIRCLE_JOB }}-{{ .Branch }}-{{ .Revision }}
        paths:
          - /root/.ccache
    - run: &run-tests
        name: Run tests
        command: cd build && ctest --output-on-failure

## The web UI half of job-template-amd64. npm/webpack and the C++ compile have no
## dependency on each other in CMake, and running them in one job is what puts the
## container over its memory limit, so each gets its own.
job-template-web-amd64: &job-template-web-amd64
  resource_class: large
  working_directory: /root/jaiabot
  steps:
    - checkout
    - restore_cache: &restore-npm-webpack-cache
        keys:
          - jaiabot-npm-webpack-v1-{{ checksum "src/web/package-lock.json" }}
          - jaiabot-npm-webpack-v1-
    - run: *run-set-deb-rep-and-version
    - run: *run-add-jaia-packages-list
    - run: *run-update-apt
    - run: &run-build-web
        name: Build the web UI
        # the web targets live in the same CMake project as everything else, so this
        # configures the whole project but builds only those targets
        command: mkdir -p build && cd build && cmake -DCMAKE_BUILD_TYPE=Debug .. && cmake --build . --target jcc_jed jdv
    - save_cache: &save-npm-webpack-cache
        key: jaiabot-npm-webpack-v1-{{ checksum "src/web/package-lock.json" }}
        paths:
          - /root/.npm
          - /root/.cache/webpack
    - run: &run-web-tests
        name: Run web tests
        command: cd build/intermediate/web && npm test

job-template-deb-amd64: &job-template-deb-amd64
  <<: *job-template-amd64
  resource_class: large
  steps:
    - attach_workspace: &attach-src-workspace
        at: /root/src
    - restore_cache: *restore-ccache
    - run: &run-extract-src
        name: Extract the original source tarball
        command: |
          cp /root/src/*.orig.tar.xz ${CIRCLE_WORKING_DIRECTORY}/.. &&
          tar xfJ ../*.orig.tar.xz --strip-components=1
    - restore_cache: *restore-npm-webpack-cache
    - run: *run-set-deb-rep-and-version
    - run: *run-add-jaia-packages-list
    - run: *run-update-apt
    - run: &run-import-gpg
        name: Import GPG key
        command: echo -e "$GPG_KEY" | gpg --import
    - run: &run-nest-deb
        name: Nest debian changelog into project source and comment out clang as build-depends (causes problems for cross-builds)
        command: |
          cp /root/src/changelog ${CIRCLE_WORKING_DIRECTORY}/debian &&
          sed -i "s/DISTRORELEASEVERSION/${DISTRO_RELEASE_VERSION}/;s/DISTRORELEASECODENAME/${DISTRO_RELEASE_CODENAME}/" ${CIRCLE_WORKING_DIRECTORY}/debian/changelog &&
          sed -i 's/^\( *\)clang/#\1clang/' ${CIRCLE_WORKING_DIRECTORY}/debian/control &&
          sed -i 's/^\( *\)lld/#\1lld/' ${CIRCLE_WORKING_DIRECTORY}/debian/control
    - run: &run-patch-version
        name: Patch the version patch number automatically in cmake/JaiaVersions.cmake
        command: |
          mkdir -p ${CIRCLE_WORKING_DIRECTORY}/debian/patches
          export NEWVERSION="$(echo ../*.orig.tar.xz | sed 's/.*_\(.*\)\.orig\.tar\.xz/\1/')"
          quilt new 01-patch-version
          quilt add cmake/JaiaVersions.cmake
          export NEWVERSION_MAJOR=$(echo $NEWVERSION | cut -d . -f 1)
          export NEWVERSION_MINOR=$(echo $NEWVERSION | cut -d . -f 2)
          export NEWVERSION_PATCH=$(echo $NEWVERSION | cut -d . -f 3)
          sed -i "s/^set(PROJECT_VERSION_MAJOR *\".*\"/set(PROJECT_VERSION_MAJOR \"${NEWVERSION_MAJOR}\"/" cmake/JaiaVersions.cmake
          sed -i "s/^set(PROJECT_VERSION_MINOR *\".*\"/set(PROJECT_VERSION_MINOR \"${NEWVERSION_MINOR}\"/" cmake/JaiaVersions.cmake
          sed -i "s/^set(PROJECT_VERSION_PATCH *\".*\"/set(PROJECT_VERSION_PATCH \"${NEWVERSION_PATCH}\"/" cmake/JaiaVersions.cmake
          quilt refresh
    - run: *run-zero-ccache-stats
    - run: &run-build-pkg
        name: Build the Debian package
        command: |
          export DPKG_BUILDPACKAGE_BUILD_TYPE="-B"
          # default is to do source and binary build
          [[ "${DO_SOURCE_BUILD}" == "true" ]] && DPKG_BUILDPACKAGE_BUILD_TYPE=""
          # skip building jaiabot-doc/jaiabot-interfaces (and the goby_clang_tool run they require) for the test repo to save build time
          # set BUILD_DOC_FOR_TEST_REPO=true to opt back into building them for test-repo builds
          export DPKG_BUILDPACKAGE_PROFILE=""
          if [[ "${JAIABOT_APT_REPO}" == "test" && "${BUILD_DOC_FOR_TEST_REPO}" != "true" ]]; then
            DPKG_BUILDPACKAGE_PROFILE="-Pnodoc"
            # "nodoc" is also a legacy DEB_BUILD_OPTIONS flag; set it explicitly so dh doesn't
            # warn about copying it over from DEB_BUILD_PROFILES on our behalf
            export DEB_BUILD_OPTIONS="${DEB_BUILD_OPTIONS} nodoc"
          fi
          # set DISABLE_OPT_FOR_TEST_REPO=true to compile test-repo builds at -O0 for faster iteration
          if [[ "${JAIABOT_APT_REPO}" == "test" && "${DISABLE_OPT_FOR_TEST_REPO}" == "true" ]]; then
            export DEB_BUILD_OPTIONS="${DEB_BUILD_OPTIONS} noopt"
          fi
          CONFIG_SITE=/etc/dpkg-cross/cross-config.${TARGET_ARCH} && dpkg-buildpackage -kB90BE706B6A6724592B53B90954A004CD5D8CF32 -a${TARGET_ARCH} ${DPKG_BUILDPACKAGE_BUILD_TYPE} ${DPKG_BUILDPACKAGE_PROFILE}
    - run: *show-ccache-stats
    - save_cache: *save-ccache
    - save_cache: *save-npm-webpack-cache
    - run: &run-store-next-build
        name: Store deb files for next build
        command: |
          mkdir -p /root/deb &&
          find .. -maxdepth 1 -type f -exec cp {}  /root/deb \; &&
          rm -f /root/deb/*-build-deps*.deb
    - run: &run-store-for-artifacts
        name: Store deb files for storing artifacts
        command: mkdir -p /tmp/deb && cp /root/deb/* /tmp/deb
    - store_artifacts: &store
        path: /tmp/deb
    - run: &remove-orig-source
        name: Remove original source file to avoid conflicts in merging
        command: |
          rm -f /root/deb/*.orig.tar.xz || true
    - persist_to_workspace: &persist-debs
        root: /root/deb
        paths:
          - "*.dsc"
          - "*.tar.xz"
          - "*.deb"
          - "*.ddeb"
          - "*.changes"
          - "*.buildinfo"

job-template-deb-cross: &job-template-deb-cross
  <<: *job-template-deb-amd64

job-template-upload: &job-template-upload
  <<: *job-template-amd64
  docker: *docker-base-light

# which branches to run the Debian build and upload on
filter-template-debian-builds: &filter-template-debian-builds
  filters:
    tags:
      only: /.*/
    branches:
      only:
        - "3.y"

# which branches to run the normal source build
filter-template-normal-builds: &filter-template-normal-builds
  filters:
    branches:
      ignore:
        - "3.y"

# which branches to run the pi-zero filesystem builds
filter-template-pi0-rootfs-builds: &filter-template-pi0-rootfs-builds
  filters:
    tags:
      only: /.*/
    branches:
      only:
        - "3.y"
        
# which branches to run the rootfs filesystem builds
filter-template-rootfs-builds: &filter-template-rootfs-builds
  filters:
    tags:
      only: /.*/
    branches:
      only:
        - "3.y"

# which branches to run the AWS virtual machine conversion (must be same as or subset of filter-template-rootfs-builds)
filter-template-aws-rootfs-builds: &filter-template-aws-rootfs-builds
  filters:
    tags:
      only: /.*/
    branches:
      only:
        - "3.y"

# a sea trial on every release/beta tag, since that is the image customers get;
# the nightly run comes from a scheduled pipeline instead, not from a branch filter
filter-template-sea-trial-tags: &filter-template-sea-trial-tags
  filters:
    tags:
      only: /.*/
    branches:
      ignore: /.*/

# which branches to build Docker simulator
filter-template-docker-sim-builds: &filter-template-docker-sim-builds
  filters:
    tags:
      only: /.*/
    branches:
      only:
        - "3.y"

## Begin actual config
version: 2.1
orbs:
  aws-cli: circleci/aws-cli@4.0
  aws-s3: circleci/aws-s3@4.0

parameters:
  # Set by the scheduled pipeline that runs the nightly sea trial. It selects the
  # sea-trial workflow instead of the commit one, so a nightly does not rebuild.
  run-sea-trial:
    type: boolean
    default: false
  sea-trial-bots:
    type: integer
    default: 2
  sea-trial-goals:
    type: integer
    default: 10
  sea-trial-warp:
    type: integer
    default: 5
  # Which image to trial. Empty follows the branch or tag, which is what the nightly
  # and the tag runs want; set it to trial a published image from a branch whose own
  # packages were never published, such as a feature branch.
  sea-trial-repo:
    type: string
    default: ""
  # Leaves the fleet up for inspection after a failure. The reaper still clears it.
  sea-trial-keep-fleet:
    type: boolean
    default: false

workflows:
  version: 2
  commit:
    when:
      not: << pipeline.parameters.run-sea-trial >>
    jobs:
      - amd64-resolute-build:
          <<: *filter-template-normal-builds
      - amd64-resolute-web-build:
          <<: *filter-template-normal-builds

      - get-orig-source:
          <<: *filter-template-debian-builds

      - amd64-resolute-deb-build:
          <<: *filter-template-debian-builds
          requires:
            - get-orig-source
      - arm64-resolute-deb-build:
          <<: *filter-template-debian-builds
          requires:
            - get-orig-source

      # runs in parallel with the deb builds; validated separately so it doesn't block upload
      - amd64-python-venv-build:
          <<: *filter-template-debian-builds

      # always do the upload if we did the deb builds
      - upload:
          filters:
            tags:
              only: /.*/
            branches:
              only: /.*/
          requires:
            - amd64-resolute-deb-build
            - arm64-resolute-deb-build

      # rootfs jobs
      - arm64-raspi-image-create-resolute:
          <<: *filter-template-rootfs-builds
          requires:
            - upload

      - amd64-virtualbox-image-create-resolute:
          <<: *filter-template-rootfs-builds
          requires:
            - upload
        
      - raspi0-rpicam-image-create-trixie:
          <<: *filter-template-pi0-rootfs-builds

      # bundle after each package upload and rootfs
      - arm64-bundle-resolute:
          filters:
            tags:
              only: /.*/
            branches:
              only: /.*/
          requires:
            - arm64-raspi-image-create-resolute

      - amd64-bundle-resolute:
          filters:
            tags:
              only: /.*/
            branches:
              only: /.*/
          requires:
            - amd64-virtualbox-image-create-resolute
            
      - aws-sync:
          requires:
            - arm64-raspi-image-create-resolute
            - amd64-virtualbox-image-create-resolute
            - amd64-bundle-resolute
            - arm64-bundle-resolute
          <<: *filter-template-aws-rootfs-builds

      - aws-sync-govcloud:
          requires:
            - arm64-raspi-image-create-resolute
            - amd64-virtualbox-image-create-resolute
            - amd64-bundle-resolute
            - arm64-bundle-resolute
          <<: *filter-template-aws-rootfs-builds

          
      # docker creation jobs
      - arm64-docker-sim:
          <<: *filter-template-docker-sim-builds
          requires:
            - upload
      - amd64-docker-sim:
          <<: *filter-template-docker-sim-builds
          requires:
            - upload
      - docker-sim-manifest:
          <<: *filter-template-docker-sim-builds
          requires:
            - arm64-docker-sim
            - amd64-docker-sim

      # fast feedback on the mission driver itself, on every commit that builds the sim
      - docker-sim-e2e:
          <<: *filter-template-docker-sim-builds
          requires:
            - amd64-docker-sim

      # a tag is an image customers get, so trial it as soon as its AMI exists
      - sea-trial-virtualfleet:
          <<: *filter-template-sea-trial-tags
          requires:
            - aws-sync

      # TEMPORARY: trial every push while this job is being brought up. Delete this
      # entry, and the repo_override job parameter, once it runs green.
      - sea-trial-virtualfleet:
          name: sea-trial-virtualfleet-branch
          repo_override: continuous
          overlay_checkout_tooling: true
          filters:
            branches:
              only:
                - ci-safe-cloudhub-create

  # Driven by a scheduled pipeline that sets run-sea-trial, rather than by a branch
  # filter, so the nightly does not rebuild everything first.
  sea-trial:
    when: << pipeline.parameters.run-sea-trial >>
    jobs:
      - sea-trial-virtualfleet


commands:
  aws-sync-command:
    parameters:
      role_arn:
        type: string
      # space separated regions, within the same partition as the job's AWS_DEFAULT_REGION
      ami_copy_regions:
        type: string
        default: ""
    steps:
      - checkout
      - attach_workspace:
          at: /tmp
      - aws-cli/setup:
          profile_name: OIDC-User
          role_arn: << parameters.role_arn >>
      - run:
          name: Set environmental variables for which repo tag to use (analogous to APT repo names)
          command: |
            repo=$(.circleci/deb_repo.sh "$CIRCLE_BRANCH" "$CIRCLE_TAG" "repo")
            version=$(.circleci/deb_repo.sh "$CIRCLE_BRANCH" "$CIRCLE_TAG" "version")
            echo "repo:${repo}"
            echo "version:${version}"
            # export these for later use
            echo "export JAIABOT_ROOTFS_GEN_REPO=${repo}" >> $BASH_ENV
            echo "export JAIABOT_ROOTFS_GEN_REPO_VERSION=${version}" >> $BASH_ENV
      - run:
          name: Delete previous images for this repo/version (except release repo)
          command: |
            if [ ! "${JAIABOT_ROOTFS_GEN_REPO}" = "release" ]; then
              aws s3 rm --recursive s3://jaia-disk-images/${JAIABOT_ROOTFS_GEN_REPO}/${JAIABOT_ROOTFS_GEN_REPO_VERSION}
            fi
      - run:
          name: Remove unnecessary files before sync to AWS
          command: |
            # No need to sync boot.tar.gz and rootfs.tar.gz
            rm /tmp/arm64/*.tar.gz
            rm /tmp/amd64/*.tar.gz
      - aws-s3/sync:
          profile_name: OIDC-User
          from: /tmp/amd64
          to: s3://jaia-disk-images/${JAIABOT_ROOTFS_GEN_REPO}/${JAIABOT_ROOTFS_GEN_REPO_VERSION}/vbox
      - aws-s3/sync:
          profile_name: OIDC-User
          from: /tmp/arm64
          to: s3://jaia-disk-images/${JAIABOT_ROOTFS_GEN_REPO}/${JAIABOT_ROOTFS_GEN_REPO_VERSION}/rpi
      - aws-s3/sync:
          profile_name: OIDC-User
          from: /tmp/bundle/result/amd64
          to: s3://jaia-disk-images/${JAIABOT_ROOTFS_GEN_REPO}/${JAIABOT_ROOTFS_GEN_REPO_VERSION}/vbox
      - aws-s3/sync:
          profile_name: OIDC-User
          from: /tmp/bundle/result/arm64
          to: s3://jaia-disk-images/${JAIABOT_ROOTFS_GEN_REPO}/${JAIABOT_ROOTFS_GEN_REPO_VERSION}/rpi
      - run:
          name: Import new AMI
          command: |
            OVA=$(basename $(ls /tmp/amd64/jaiabot__rootfs-${DISTRO_RELEASE_CODENAME}*.ova))
            IMAGE_NAME=${OVA%.*}

            curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo apt-key add -
            sudo apt-add-repository -y "deb [arch=amd64] https://apt.releases.hashicorp.com $(lsb_release -cs) main"
            sudo apt-get update && sudo apt-get -y install packer
            packer plugins install github.com/hashicorp/ansible
            packer plugins install github.com/hashicorp/amazon

            export JAIA_UPGRADE_ISO_SOURCE=local
            export JAIA_UPGRADE_ISO_LOCAL_DIR=/tmp/bundle/result/amd64

            AMI_NAME=$(echo $IMAGE_NAME | sed 's/+/[plus]/g' | sed 's/~/[tilde]/g')

            rootfs/cloud/aws/packer/packer-create-ami-by-upgrade.sh "${AMI_NAME}" "${JAIABOT_ROOTFS_GEN_REPO}"

            echo "export JAIABOT_IMAGE_NAME=${IMAGE_NAME}" >> $BASH_ENV
            echo "export JAIABOT_AMI_NAME=${AMI_NAME}" >> $BASH_ENV
      - run:
          name: Deregister old AMI and delete snapshots
          command: |
            rootfs/cloud/aws/delete_ami.sh ${JAIABOT_ROOTFS_GEN_REPO} ${JAIABOT_ROOTFS_GEN_REPO_VERSION}
      - run:
          name: Tag new AMI
          command: |
            source /tmp/amd64/*.metadata.txt

            image_id=$(aws ec2 describe-images --filters "Name=name,Values=\"${JAIABOT_AMI_NAME}\"" --query 'Images[*].[ImageId]' --output text)
            snapshot_id=$(aws ec2 describe-images --filters "Name=name,Values=\"${JAIABOT_AMI_NAME}\"" --query 'Images[*].[BlockDeviceMappings[0].Ebs.SnapshotId]' --output text)

            aws ec2 create-tags --resources ${image_id} ${snapshot_id} --tags \
              "Key=Name,Value=${JAIABOT_IMAGE_NAME}" \
              "Key=jaia_creator,Value=circleci" \
              "Key=jaiabot-rootfs-gen_version,Value=${JAIABOT_ROOTFS_GEN_TAG}" \
              "Key=jaiabot-rootfs-gen_distro,Value=${DISTRO_RELEASE_CODENAME}" \
              "Key=jaiabot-rootfs-gen_repository,Value=${JAIABOT_ROOTFS_GEN_REPO}" \
              "Key=jaiabot-rootfs-gen_repository_version,Value=${JAIABOT_ROOTFS_GEN_REPO_VERSION}" \
              "Key=jaiabot-rootfs-gen_build-date,Value=$(date -u)" \
              "Key=jaiabot-rootfs-gen_build-unixtime,Value=$(date -u +%s)" \
              "Key=jaiabot_version_when_built,Value=${JAIABOT_VERSION}" \
              "Key=goby_version_when_built,Value=${GOBY_VERSION}"
      - run:
          name: Copy new AMI to additional regions
          command: |
            ami_copy_regions="<< parameters.ami_copy_regions >>"
            if [ -z "${ami_copy_regions}" ]; then
              echo "No additional AMI regions configured"
              exit 0
            fi
            rootfs/cloud/aws/copy_ami_to_regions.sh "${JAIABOT_AMI_NAME}" "${JAIABOT_ROOTFS_GEN_REPO}" "${JAIABOT_ROOTFS_GEN_REPO_VERSION}" ${ami_copy_regions}


jobs:
  docker-sim-e2e:
    machine:
      image: ubuntu-2604:current
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Set environmental variables for which packages.jaia.tech repo to use
          command: |
            repo=$(.circleci/deb_repo.sh "$CIRCLE_BRANCH" "$CIRCLE_TAG" "repo")
            version=$(.circleci/deb_repo.sh "$CIRCLE_BRANCH" "$CIRCLE_TAG" "version")
            echo "export JAIABOT_APT_REPO=${repo}" >> $BASH_ENV
            echo "export JAIABOT_APT_VERSION=${version}" >> $BASH_ENV
      - run:
          name: Test the mission driver itself
          command: cd scripts/test/e2e && python3 -m unittest discover -p 'test_*.py' -v
      - run:
          name: Start the simulator
          command: |
            if [[ "$JAIABOT_APT_REPO" = "release" ]]; then
              TAG="$CIRCLE_TAG"
            else
              TAG="${JAIABOT_APT_VERSION}-${JAIABOT_APT_REPO}"
            fi
            echo $DOCKERHUB_PASSWORD | docker login -u $DOCKERHUB_USERNAME --password-stdin
            docker run -d --name jaia-sim -p 9092:9092 \
              -e JAIA_SIM_BOTS=1 -e JAIA_SIM_WARP=10 -e JAIA_SIM_FLEET=30 \
              gobysoft/jaiabot-sim:${TAG}-amd64
      - run:
          name: Run a short dive mission against the simulator
          command: |
            scripts/test/e2e/jaia-sea-trial.py \
              --hub-url http://localhost:9092 --api-key simulation \
              --bots 1 --goals 2 --warp 10 \
              --output-dir /tmp/sea-trial-sim
      - run:
          name: Simulator log
          when: always
          command: docker logs jaia-sim 2>&1 | tail -200
      - store_test_results:
          path: /tmp/sea-trial-sim
      - store_artifacts:
          path: /tmp/sea-trial-sim

  sea-trial-virtualfleet:
    parameters:
      # like the sea-trial-repo pipeline parameter, but settable per workflow entry
      repo_override:
        type: string
        default: ""
      # TEMPORARY, with the branch entry that sets it: until this change is published,
      # no package carries the flags below, so the checkout's copies stand in for the
      # ones a package built from this commit would contain.
      overlay_checkout_tooling:
        type: boolean
        default: false
    # 26.04 so the jaiabot packages install natively, and a machine executor so the
    # fleet VPN can be brought up the way an operator's machine does
    machine:
      image: ubuntu-2604:current
    resource_class: medium
    environment:
      AWS_DEFAULT_REGION: ca-central-1
      JAIA_CI_FLEET: 9
    steps:
      - checkout
      - run:
          name: Set environmental variables for which packages.jaia.tech repo to use
          command: |
            repo=$(.circleci/deb_repo.sh "$CIRCLE_BRANCH" "$CIRCLE_TAG" "repo")
            version=$(.circleci/deb_repo.sh "$CIRCLE_BRANCH" "$CIRCLE_TAG" "version")
            echo "export JAIABOT_APT_REPO=${repo}" >> $BASH_ENV
            echo "export JAIABOT_APT_VERSION=${version}" >> $BASH_ENV
            echo "export JAIA_CI_CUSTOMER=jaia-ci-${CIRCLE_WORKFLOW_ID}" >> $BASH_ENV
            trial_repo="<< pipeline.parameters.sea-trial-repo >>"
            trial_repo="${trial_repo:-<< parameters.repo_override >>}"
            echo "export JAIA_CI_REPO=${trial_repo:-$repo}" >> $BASH_ENV
      - aws-cli/setup:
          profile_name: OIDC-User
          role_arn: arn:aws:iam::120512385734:role/JaiaCircleCI
      - run:
          # only once the orb has written it: setting it any earlier and the orb's own
          # aws calls fail looking for a profile that does not exist yet
          name: Use the profile the orb just wrote
          command: echo "export AWS_PROFILE=OIDC-User" >> $BASH_ENV
      - run:
          name: Install the jaiabot tooling this commit built
          command: |
            sudo install -d -m 0755 /etc/apt/keyrings
            curl -fsSL "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x19478082E2F8D3FE" \
              | sudo gpg --dearmor -o /etc/apt/keyrings/gobysoft.gpg
            curl -fsSL "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x954A004CD5D8CF32" \
              | sudo gpg --dearmor -o /etc/apt/keyrings/jaiabot.gpg
            codename=$(lsb_release -c -s)
            # the same repo the image comes from: tooling from a different one writes
            # answers the image's packages no longer accept, or lacks flags entirely
            echo "deb [signed-by=/etc/apt/keyrings/gobysoft.gpg] http://packages.jaia.tech/ubuntu/gobysoft/${JAIA_CI_REPO}/${JAIABOT_APT_VERSION} ${codename}/" \
              | sudo tee /etc/apt/sources.list.d/gobysoft.list
            echo "deb [signed-by=/etc/apt/keyrings/jaiabot.gpg] http://packages.jaia.tech/ubuntu/${JAIA_CI_REPO}/${JAIABOT_APT_VERSION} ${codename}/" \
              | sudo tee /etc/apt/sources.list.d/jaiabot.list
            sudo apt-get update
            # jaiabot-python's postinst pip-installs pyjaia, so this step needs PyPI
            sudo apt-get install -y jaiabot-apps jaiabot-python wireguard wireguard-tools \
              cloud-init ansible jq rsync
            # the images point python3 at pyenv, which cannot see the protobuf bindings
            # these packages install for the system interpreter
            if command -v pyenv > /dev/null; then pyenv global system; fi
            python3 -c "import sys; from google.protobuf import text_format; print('protobuf bindings visible to', sys.executable)"
            echo "installed jaiabot: $(jaia version 2>&1 | sed -n 2p)"
            if [ "<< parameters.overlay_checkout_tooling >>" = "true" ]; then
              sudo cp src/sh/fleet/jaia-create-cloudhub.py src/sh/fleet/jaia-delete-cloudhub.py /usr/bin/
              echo "overlaid the checkout's cloudhub tooling"
            fi
            # a one-line failure here beats an argparse dump from inside the create step
            if ! jaia admin fleet create_cloudhub --help | grep -q -- --permissions-boundary; then
              echo "ERROR: installed tooling predates this checkout; it cannot drive this trial" >&2
              exit 1
            fi
      - run:
          name: Reap any CI fleet a killed build left behind
          command: rootfs/cloud/aws/reap_ci_fleets.sh --max-age-hours 4
      - run:
          # a CI fleet is one reserved id, so overlapping runs queue rather than the
          # later one failing outright; the reaper above has already taken any fleet
          # whose run is long gone
          name: Wait for the fleet to be free
          command: |
            rootfs/cloud/aws/circleci/wait-for-free-fleet.sh \
              --timeout-minutes 30 "${JAIA_CI_FLEET}"
          no_output_timeout: 35m
      - run:
          name: Create the CloudHub
          command: |
            mkdir -p /tmp/sea-trial
            rootfs/cloud/aws/circleci/make-ci-fleet-config.sh \
              --fleet "${JAIA_CI_FLEET}" \
              --bots << pipeline.parameters.sea-trial-bots >> \
              --warp << pipeline.parameters.sea-trial-warp >> \
              /tmp/sea-trial/fleet.cfg
            jaia admin fleet create_cloudhub /tmp/sea-trial/fleet.cfg "${JAIA_CI_CUSTOMER}" \
              --region "${AWS_DEFAULT_REGION}" \
              --repo "${JAIA_CI_REPO}" \
              --permissions-boundary JaiaCloudHubBoundary \
              --virtualfleet-instance-type t3a.small \
              --output-json /tmp/sea-trial/cloudhub.json \
              --jaiabot-dir "${PWD}" \
              --aws-profile OIDC-User
          no_output_timeout: 30m
      - run:
          name: Raise the VirtualFleet from the same AMI
          command: |
            CLOUDHUB=cloudhub-fleet${JAIA_CI_FLEET}
            # the playbooks ship with jaiabot-config, so they are already the ones
            # belonging to the image under test
            ssh -o StrictHostKeyChecking=no jaia@${CLOUDHUB} \
              "cd /usr/share/jaiabot/config/ansible && ansible-playbook cloud/create-virtualfleet.yml \
                 -e n_bots=<< pipeline.parameters.sea-trial-bots >> \
                 -e warp=<< pipeline.parameters.sea-trial-warp >>"
          no_output_timeout: 30m
      - run:
          name: Send the fleet on its dive mission
          command: |
            CLOUDHUB=cloudhub-fleet${JAIA_CI_FLEET}
            # driven from the CloudHub, which already reaches the VirtualFleet and holds
            # the offloaded logs locally
            rsync -a -e "ssh -o StrictHostKeyChecking=no" scripts/test/e2e/ jaia@${CLOUDHUB}:/tmp/e2e/
            ssh -o StrictHostKeyChecking=no jaia@${CLOUDHUB} \
              "python3 /tmp/e2e/jaia-sea-trial.py \
                 --hub-url http://hub1-virtualfleet${JAIA_CI_FLEET} \
                 --bots << pipeline.parameters.sea-trial-bots >> \
                 --goals << pipeline.parameters.sea-trial-goals >> \
                 --warp << pipeline.parameters.sea-trial-warp >> \
                 --offload-dir /var/log/jaiabot/bot_offload \
                 --output-dir /tmp/sea-trial"
          no_output_timeout: 60m
      - run:
          name: Collect results
          when: always
          command: |
            mkdir -p /tmp/sea-trial
            CLOUDHUB=cloudhub-fleet${JAIA_CI_FLEET}
            rsync -a -e "ssh -o StrictHostKeyChecking=no" \
              jaia@${CLOUDHUB}:/tmp/sea-trial/ /tmp/sea-trial/ || true
            ssh -o StrictHostKeyChecking=no jaia@${CLOUDHUB} \
              "sudo journalctl -n 2000 --no-pager" > /tmp/sea-trial/cloudhub-journal.txt || true
      - run:
          name: Tear down
          when: always
          command: |
            if [ "<< pipeline.parameters.sea-trial-keep-fleet >>" = "true" ]; then
              echo "sea-trial-keep-fleet is set; leaving fleet ${JAIA_CI_FLEET} up for the reaper"
              exit 0
            fi
            # only this run's fleet: a concurrent trial reuses the same fleet id, and
            # this step runs under when: always, including when create never got there
            jaia admin fleet delete_cloudhub --region "${AWS_DEFAULT_REGION}" \
              --aws-profile OIDC-User --jaiabot-dir "${PWD}" --yes \
              --customer "${JAIA_CI_CUSTOMER}" "${JAIA_CI_FLEET}"
            rootfs/cloud/aws/circleci/delete-ci-bucket.sh "${JAIA_CI_FLEET}"
          no_output_timeout: 30m
      - store_test_results:
          path: /tmp/sea-trial
      - store_artifacts:
          path: /tmp/sea-trial

  get-orig-source:
    <<: *job-template-deb-amd64
    docker: *docker-base-light
    resource_class: small
    environment:
      <<: *environment-template-common
      <<: *environment-template-resolute
      <<: *environment-template-amd64
    steps:
      - checkout
      - run: git submodule sync
      - run: git submodule update --init
      - run:
          name: Get original source tarball
          command: |
            # use long format for continuous builds so they always rank after release builds
            # use tag directly for release/beta builds
            [ -z "${CIRCLE_TAG}" ] && export RAWVERSION="$(git describe --tags HEAD --long)" || export RAWVERSION="${CIRCLE_TAG}"
            export NEWVERSION="$(echo ${RAWVERSION} | sed 's/_/~/' | sed 's/-/+/g')"
            mkdir -p /root/src
            export OUTTAR=/root/src/jaiabot_${NEWVERSION}.orig.tar
            # archive core repo
            git archive --format tar --prefix=jaiabot-${NEWVERSION}/ -o $OUTTAR HEAD;
            # archive submodules
            git submodule --quiet foreach --recursive 'git archive --format tar --prefix=jaiabot-${NEWVERSION}/$displaypath/ -o submodule.tar HEAD'
            # concatentate submodule tarballs onto core repo
            TOPDIR=$(pwd) git submodule --quiet foreach --recursive 'cd $TOPDIR; tar --concatenate --file=$OUTTAR $displaypath/submodule.tar; rm -fv $displaypath/submodule.tar'
            # compress output with XZ
            xz $OUTTAR
      - run:
          name: Add changelog entry
          command: |
            cd /root/jaiabot &&
            export NEWVERSION="$(echo /root/src/*.orig.tar.xz | sed 's/.*_\(.*\)\.orig\.tar\.xz/\1/')"
            COMMENT="Autobuild for version ${NEWVERSION}" &&
            dch --newversion=${NEWVERSION}-0+DISTRORELEASEVERSION.1 -D DISTRORELEASECODENAME "${COMMENT}" &&
            cp debian/changelog /root/src
      - store_artifacts:
          path: /root/src
      - persist_to_workspace:
          root: /root/src
          paths:
            - "*.tar.xz"
            - "changelog"

  amd64-resolute-build:
    <<: *job-template-amd64
    docker: *docker-base-resolute
    environment:
      <<: *environment-template-common
      <<: *environment-template-resolute
      <<: *environment-template-amd64

  amd64-resolute-web-build:
    <<: *job-template-web-amd64
    docker: *docker-base-resolute
    environment:
      <<: *environment-template-common
      <<: *environment-template-resolute
      <<: *environment-template-amd64

  amd64-resolute-deb-build:
    <<: *job-template-deb-amd64
    docker: *docker-base-resolute
    environment:
      <<: *environment-template-common
      <<: *environment-template-resolute
      <<: *environment-template-amd64
  arm64-resolute-deb-build:
    <<: *job-template-deb-cross
    docker: *docker-arm64-resolute
    environment:
      <<: *environment-template-common
      <<: *environment-template-resolute
      <<: *environment-template-arm64

  amd64-python-venv-build:
    docker: *docker-base-resolute
    resource_class: large
    working_directory: /root/jaiabot
    environment:
      <<: *environment-template-common
      <<: *environment-template-resolute
      <<: *environment-template-amd64
    steps:
      - checkout
      - run: git submodule sync
      - run: git submodule update --init
      - run:
          name: Build Python venv to ensure it builds successfully (for later use when jaiabot-python is installed)
          command: |
            apt-get update && apt-get -y install rsync python3-venv python3-dev
            cd src/python
            unset CC CXX
            ./build_venv.sh /tmp/jaiabot-python-test

  upload:
    <<: *job-template-upload
    environment:
      <<: *environment-template-common
      <<: *environment-template-resolute
      <<: *environment-template-amd64
    resource_class: small
    steps: &steps-upload
      - checkout
      - add_ssh_keys:
          fingerprints:
            - "5a:bc:88:89:21:a2:a0:cd:68:07:b5:26:f0:64:28:e9"
      - run: *run-import-gpg
      - attach_workspace:
          at: /root/deb
      - attach_workspace: *attach-src-workspace
      - run:
          name: Move original source into output directory
          command: mv /root/src/* /root/deb
      - run: *run-set-deb-rep-and-version
      - run:
          name: Upload packages to packages.jaia.tech
          command: |
            echo 'trusted-key 954A004CD5D8CF32' >> ~/.gnupg/gpg.conf
            echo '|1|pdeN5jVicoT8qgAbw7Wd10DSjtA=|Lbu1IC80DrCY9/cnDZSmG9upweM= ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIG89ZqxUp9T8j4wOV77EmFH/+OpKAxIHLohhHj5L5z1l' >> ~/.ssh/known_hosts
            for change_file in /root/deb/*.changes;
            do dput -c ${CIRCLE_WORKING_DIRECTORY}/.circleci/dput.cf jaiabot-${JAIABOT_APT_REPO}-${JAIABOT_APT_VERSION} $change_file;
            done

  # rootfs jobs
  arm64-raspi-image-create-resolute:
    machine:
      image: ubuntu-2404:current
    resource_class: arm.medium
    environment:
      CREATE_IMAGE_ARGS: "--native"
      DISTRO_RELEASE_CODENAME: "resolute"
      DEBIAN_FRONTEND: "noninteractive"
      <<: *environment-template-arm64
    steps:
      - checkout
      - run: &run-install-apt-raspi
          name: Install apt dependencies
          command: sudo apt-get update && sudo apt-get -y install pigz dosfstools gcc-aarch64-linux-gnu git kpartx live-build sudo wget
      - run: *run-set-deb-rep-and-version
      - run: &run-create-image
          name: Create filesystem image
          command: |
            if [ ! -z "$CIRCLE_BRANCH" ]; then
              export CIRCLE_BRANCH_ESC=$(echo "$CIRCLE_BRANCH-" | tr '/' '_');
            else
              export CIRCLE_BRANCH_ESC=""
            fi
            export ROOTFS_BUILD_TAG="$(git describe --tags HEAD | sed 's/_/~/' | sed 's/-/+/g')"
            export TMP_IMG_NAME=jaiabot
            mkdir /tmp/${TARGET_ARCH}
            sudo rootfs/scripts/create_raspi_base_image.sh --dest ${TMP_IMG_NAME}.img --distribution ${DISTRO_RELEASE_CODENAME} --repo ${JAIABOT_APT_REPO} --version ${JAIABOT_APT_VERSION} ${CREATE_IMAGE_ARGS}
            source ${TMP_IMG_NAME}.metadata.txt
            for filename in ${TMP_IMG_NAME}.*; do
              extension="${filename#*.}"
              mv "${TMP_IMG_NAME}.${extension}" "/tmp/${TARGET_ARCH}/jaiabot__rootfs-${DISTRO_RELEASE_CODENAME}-${CIRCLE_BRANCH_ESC}v${JAIABOT_ROOTFS_GEN_TAG}.${extension}"
            done

            # Avoid permission denied on persist_to_workspace
            sudo chmod -R a+r /tmp/${TARGET_ARCH}
      - run: &run-compress-image-raspi
          name: Compress image
          command: pigz /tmp/arm64/*.img
      - store_artifacts: &store-raspi
          path: /tmp/arm64/
      - persist_to_workspace: &persist-raspi
          root: /tmp
          paths:
            - "arm64/*.img.gz"
            - "arm64/*.tar.gz"
            - "arm64/*.metadata.txt"

  amd64-virtualbox-image-create-resolute:
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    environment:
      CREATE_IMAGE_ARGS: "--virtualbox"
      DISTRO_RELEASE_CODENAME: "resolute"
      DEBIAN_FRONTEND: "noninteractive"
      <<: *environment-template-amd64
    steps:
      - checkout
      - run: &run-install-apt-vbox
          name: Install apt dependencies
          command: sudo apt-get update && sudo apt-get -y install dosfstools gcc-aarch64-linux-gnu git kpartx live-build sudo wget virtualbox
      - run: *run-set-deb-rep-and-version
      - run: *run-create-image
      - run:
          name: Remove unneeded artifacts
          command: |
            rm -f /tmp/amd64/*.img /tmp/amd64/*.vdi            
      - store_artifacts: &store-vbox
          path: /tmp/amd64/
      - persist_to_workspace: &persist-vbox
          root: /tmp
          paths:
            - "amd64/*.ova"
            - "amd64/*.tar.gz"
            - "amd64/*.metadata.txt"
            
  arm64-bundle-resolute:
    working_directory: /tmp/bundle/jaiabot
    machine:
      image: ubuntu-2404:current
    resource_class: arm.medium
    environment:
      <<: *environment-template-resolute
      <<: *environment-template-arm64
    steps:
      - checkout
      - run: *run-set-deb-rep-and-version
      - attach_workspace:
          at: /tmp
      - run: &run-bundle-package
          name: Bundle package (to jaiabot/build/bundle/jaiabot_bundle.tar)
          command: |
            cd /tmp/bundle/jaiabot

            # Include major upgrade tarballs in .iso
            mkdir -p build/bundle/major_upgrade
            mv /tmp/${TARGET_ARCH}/*.tar.gz build/bundle/major_upgrade
            rootfs_version=$(basename build/bundle/major_upgrade/*.boot.tar.gz .boot.tar.gz)
            cat \<< EOF  > build/bundle/major_upgrade/version.txt
            major_upgrade_version_shortcode=v$(echo ${JAIABOT_APT_VERSION} | cut -d '.' -f 1)_${DISTRO_RELEASE_CODENAME}
            major_upgrade_rootfs_version=${rootfs_version}
            major_upgrade_version=$(echo ${rootfs_version} | sed 's/.*-v\([1-9]\+\.[0-9]\+\.[0-9]\+.*\)/\1/')
            major_upgrade_ubuntu_version=$(echo ${DISTRO_RELEASE_VERSION} | sed 's/ubuntu//')
            major_upgrade_arch=${TARGET_ARCH}
            major_upgrade_rootfs_checksum=sha256:$(sha256sum build/bundle/major_upgrade/${rootfs_version}.rootfs.tar.gz | cut -d ' ' -f 1)
            major_upgrade_bootfs_checksum=sha256:$(sha256sum build/bundle/major_upgrade/${rootfs_version}.boot.tar.gz | cut -d ' ' -f 1)
            major_upgrade_previous_major=$(( $(echo ${JAIABOT_APT_VERSION} | cut -d '.' -f 1) - 1 ))
            major_upgrade_fleet_config_version=$(sed -n 's/^option (jaia.file).fleet_config_version = \([0-9]*\);.*/\1/p' src/lib/messages/fleet_config.proto)
            EOF
            
            
            sudo docker run --rm -v `pwd`:/jaiabot -w /jaiabot ubuntu:${DISTRO_RELEASE_CODENAME} ./scripts/build/bundle-update.sh ${DISTRO_RELEASE_CODENAME} ${JAIABOT_APT_REPO} ${JAIABOT_APT_VERSION}
            cd build/bundle
            export NEWVERSION="$(echo jaiabot-embedded_*.deb | sed 's/.*_\(.*\)\-.*/\1/')"

            outdir=/tmp/bundle/result/${TARGET_ARCH}
            sudo mkdir -p ${outdir}
            iso_name=jaiabot_updates_${DISTRO_RELEASE_CODENAME}_${NEWVERSION}_${TARGET_ARCH}.iso
            sudo cp ../jaiabot_updates.iso ${outdir}/${iso_name}
            sudo cp major_upgrade/version.txt ${outdir}/version.txt
            cat \<< EOF | sudo tee -a ${outdir}/version.txt
            iso_name=${iso_name}
            EOF

      - store_artifacts: &store-bundle-artifacts-arm64
          path: /tmp/bundle/result/arm64

      - persist_to_workspace: &persist-bundle-arm64
          root: /tmp
          paths:
            - "bundle/result/arm64/*.iso"
            - "bundle/result/arm64/version.txt"

  amd64-bundle-resolute:
    working_directory: /tmp/bundle/jaiabot
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    environment:
      <<: *environment-template-resolute
      <<: *environment-template-amd64
    steps:
      - checkout
      - run: *run-set-deb-rep-and-version
      - attach_workspace:
          at: /tmp
      - run: *run-bundle-package
      - store_artifacts: &store-bundle-artifacts-amd64
          path: /tmp/bundle/result/amd64
      - persist_to_workspace: &persist-bundle-amd64
          root: /tmp
          paths:
            - "bundle/result/amd64/*.iso"
            - "bundle/result/amd64/version.txt"

  raspi0-rpicam-image-create-trixie:
    machine:
      image: ubuntu-2404:current
    resource_class: medium      
    steps:
      - checkout
      - run: *run-set-deb-rep-and-version
      - run:
          name: Build image
          command: |
            export ROOTFS_BUILD_TAG="$(git describe --tags HEAD | sed 's/_/~/' | sed 's/-/+/g')"

            curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo apt-key add -
            sudo apt-add-repository -y "deb [arch=amd64] https://apt.releases.hashicorp.com $(lsb_release -cs) main"
            sudo apt-get update && sudo apt-get -y install packer
            packer plugins install github.com/hashicorp/ansible
            packer plugins install github.com/hashicorp/amazon

            cd rootfs/rpicam-zero
            ./build.sh
            
            mkdir /tmp/arm64
            cp images/jaiabot__rpicam-zero-trixie.img /tmp/arm64/jaiabot__rpicam-zero-trixie_${ROOTFS_BUILD_TAG}.img
      - run: *run-compress-image-raspi
      - store_artifacts: *store-raspi

  aws-sync:
    docker:
      - image: cimg/base:current
    environment:
      AWS_DEFAULT_REGION: "us-east-1"
      DISTRO_RELEASE_CODENAME: "resolute"
    resource_class: medium
    steps:
      - aws-sync-command:
          role_arn: arn:aws:iam::120512385734:role/JaiaCircleCI
          ami_copy_regions: "ca-central-1"

  aws-sync-govcloud:
    docker:
      - image: cimg/base:current
    environment:
      AWS_DEFAULT_REGION: "us-gov-east-1"
      DISTRO_RELEASE_CODENAME: "resolute"
    resource_class: medium
    steps:
      # no ami_copy_regions: GovCloud is a separate partition, so AMIs cannot be copied to or from commercial regions
      - aws-sync-command:
          role_arn: arn:aws-us-gov:iam::497433381399:role/JaiaCircleCI

  arm64-docker-sim:
    environment:
      <<: *environment-template-arm64    
    working_directory: /tmp/docker/jaiabot
    docker: &docker-sim-docker
      - image: cimg/base:current
        auth:
          username: $DOCKERHUB_USERNAME
          password: $DOCKERHUB_PASSWORD
    resource_class: arm.large
    steps:
      - checkout
      - run: *run-set-deb-rep-and-version
      - setup_remote_docker:
          docker_layer_caching: true
      - run: &run-build-docker-sim
          name: Build and Push Docker Sim Image
          command: |
            cmake -P cmake/ConfigureDockerfiles.cmake
            cd scripts/sim-docker

            if [[ "$JAIABOT_APT_REPO" = "release" ]]; then
              TAG="$CIRCLE_TAG"
            else
              TAG="${JAIABOT_APT_VERSION}-${JAIABOT_APT_REPO}"
            fi
            
            docker build --no-cache -t gobysoft/jaiabot-sim:$TAG-$TARGET_ARCH --build-arg JAIABOT_APT_REPO="$JAIABOT_APT_REPO" .
            echo $DOCKERHUB_PASSWORD | docker login -u $DOCKERHUB_USERNAME --password-stdin
            docker push gobysoft/jaiabot-sim:$TAG-$TARGET_ARCH
  
  amd64-docker-sim:
    environment:
      <<: *environment-template-amd64    
    working_directory: /tmp/docker/jaiabot
    docker: *docker-sim-docker
    resource_class: large
    steps:
      - checkout
      - run: *run-set-deb-rep-and-version
      - setup_remote_docker:
          docker_layer_caching: true
      - run: *run-build-docker-sim

  docker-sim-manifest:
    environment:
      <<: *environment-template-amd64    
    docker: *docker-sim-docker
    resource_class: medium
    steps:
      - checkout
      - run: *run-set-deb-rep-and-version
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: Create and push docker manifest
          command: |
            if [[ "$JAIABOT_APT_REPO" = "release" ]]; then
              TAG="$CIRCLE_TAG"
            else
              TAG="${JAIABOT_APT_VERSION}-${JAIABOT_APT_REPO}"
            fi

            docker manifest create gobysoft/jaiabot-sim:$TAG gobysoft/jaiabot-sim:$TAG-amd64 gobysoft/jaiabot-sim:$TAG-arm64
            echo $DOCKERHUB_PASSWORD | docker login -u $DOCKERHUB_USERNAME --password-stdin
            docker manifest push gobysoft/jaiabot-sim:$TAG
