[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyjaia"
version = "1.0.0"
description = "Jaia python utilities."
requires-python = ">=3.8"
authors = [
    { name = "Ed Sanville (Jaia Robotics)", email = "edsanville@gmail.com" },
]
keywords = ["jaia"]
dependencies = [
    'wheel',
    'protobuf==3.20.0',
    'scipy',
    'numpy',
    'cmocean',
    'turfpy',
    'h5py',
    'plotly',
    'scikit-learn',
    'pandas',
]

[project.urls]
Homepage = "https://www.jaia.tech"
"Bug Tracker" = "https://github.com/jaiarobotics/jaiabot"

[tool.setuptools.packages.find]
where = ["src"] # Specify where Setuptools should look for packages

[project.scripts]
jaia-analyze-waves = "pyjaia.waves.analyze_tool:main"
jaia-ubx-extractor = "pyjaia.ubx.extractor_tool:main"
jaia-battery-extract = "pyjaia.battery_prediction.extract_features:main"
jaia-battery-train = "pyjaia.battery_prediction.train:main"
jaia-battery-calibrate = "pyjaia.battery_prediction.calibrate:main"
jaia-battery-physics-test = "pyjaia.battery_prediction.physics_tests:main"

[tool.setuptools.package-data]
"pyjaia" = ["data/*.png"]
"pyjaia.battery_prediction" = ["battery_model.pkl", "dataset.csv", "calibration.json"]

