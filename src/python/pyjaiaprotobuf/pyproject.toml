[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyjaiaprotobuf"
version = "1.0.0"
description = "Jaia python protobuf messages"
requires-python = ">=3.8"
authors = [
    { name = "Ed Sanville (Jaia Robotics)", email = "edsanville@gmail.com" },
]
keywords = ["jaia"]
dependencies = [
    'protobuf==3.20.0', 
]

[project.urls]
Homepage = "https://www.jaia.tech"
"Bug Tracker" = "https://github.com/jaiarobotics/jaiabot"

[tool.setuptools.packages.find]
where = ["src"] # Specify where Setuptools should look for packages

[tool.setuptools]
# nanopb.proto generates a standalone nanopb_pb2.py at the src root (not inside
# a package directory), so packages.find alone won't include it in the wheel.
py-modules = ["nanopb_pb2"]

[tool.setuptools.package-dir]
"" = "src"

