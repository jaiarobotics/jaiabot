[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyjaiaprotobuf"
version = "1.0.0"
description = "Jaia python protobuf messages"
requires-python = ">=3.8"
authors = [
    { name = "Ed Sanville (Jaia Robotics)", email = "edsanville@gmail.com" },
]
keywords = ["jaia"]
dependencies = [
    'protobuf==3.20.0', 
]

[project.urls]
Homepage = "https://www.jaia.tech"
"Bug Tracker" = "https://github.com/jaiarobotics/jaiabot"

# nanopb_pb2.py is generated flat at the src/ root (no package dir), so
# packages.find won't pick it up on its own
[tool.setuptools]
py-modules = ["nanopb_pb2"]

[tool.setuptools.packages.find]
where = ["src"] # Specify where Setuptools should look for packages
