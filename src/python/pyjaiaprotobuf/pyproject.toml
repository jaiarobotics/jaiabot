[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyjaiaprotobuf"
version = "1.0.0"
description = "Jaia python protobuf messages"
requires-python = ">=3.8"
authors = [
    { name = "Ed Sanville (Jaia Robotics)", email = "edsanville@gmail.com" },
]
keywords = ["jaia"]
dependencies = [
    'protobuf==3.20.0', 
]

[project.urls]
Homepage = "https://www.jaia.tech"
"Bug Tracker" = "https://github.com/jaiarobotics/jaiabot"

[tool.setuptools.packages.find]
where = ["src"] # Specify where Setuptools should look for packages

# setuptools' package discovery only picks up directories (packages), not loose
# top-level modules; nanopb.proto's generated nanopb_pb2.py sits directly in
# src/ and is imported by any *_pb2.py generated from a .proto that uses nanopb
# options (e.g. storm_mcu.proto), so it must be listed explicitly.
[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["nanopb_pb2"]

