fleet: 7
hubs: [1, 30]
bots: [1, 2]
ssh {
  hub { id: 1 private_key: "-----BEGIN OPENSSH PRIVATE KEY-----\nhub1\n-----END OPENSSH PRIVATE KEY-----\n" public_key: "no-touch-required sk-ssh-ed25519@openssh.com AAAAhub1 hub1_fleet7" }
  hub { id: 30 private_key: "-----BEGIN OPENSSH PRIVATE KEY-----\nhub30\n-----END OPENSSH PRIVATE KEY-----\n" public_key: "ssh-ed25519 AAAAhub30 hub30_fleet7" }
  vpn_tmp { private_key: "-----BEGIN OPENSSH PRIVATE KEY-----\nvpn\n-----END OPENSSH PRIVATE KEY-----\n" public_key: "ssh-ed25519 AAAAvpn id_vpn_tmp" }
  permanent_authorized_keys: "ssh-ed25519 AAAAperm someone@example"
}
wlan_password: "fleet-wifi-secret"
service_vpn_enabled: true
debconf {
  key: "jaiabot-embedded/additional_sensors"
  type: MULTISELECT
  value: "none"
}
debconf {
  key: "jaiabot-embedded/arduino_type"
  type: SELECT
  value: "usb_new"
}
debconf {
  key: "jaiabot-embedded/bot_type"
  type: SELECT
  value: "echo"
}
debconf {
  key: "jaiabot-embedded/camera_positions"
  type: MULTISELECT
  value: "aft,fore"
}
debconf {
  key: "jaiabot-embedded/comms_links"
  type: MULTISELECT
  value: "xbee,wifi"
}
debconf {
  key: "jaiabot-embedded/dccl_encryption_password"
  type: STRING
  value: "dccl-secret"
}
debconf {
  key: "jaiabot-embedded/electronics_stack"
  type: SELECT
  value: "2"
}
debconf {
  key: "jaiabot-embedded/imu_type"
  type: SELECT
  value: "bno085"
}
debconf {
  key: "jaiabot-embedded/rf_encryption_password"
  type: STRING
  value: "0123456789abcdef0123456789abcdef"
}
debconf {
  key: "jaiabot-embedded/user_role"
  type: SELECT
  value: "advanced"
}
debconf {
  key: "jaiabot-embedded/mode"
  type: SELECT
  value: "runtime"
}
debconf_override {
  type: BOT
  id: 2
  debconf {
    key: "jaiabot-embedded/bot_type"
    type: SELECT
    value: "bio"
  }
  debconf {
    key: "jaiabot-embedded/camera_positions"
    type: MULTISELECT
    value: "outward"
  }
}
comms {
  iridium_sbd {
    bot { id: 1 imei: "300234010000001" }
    bot { id: 2 imei: "300234010000002" }
    sbd_type: SBD_ROCKBLOCK
    rockblock { username: "rb-user" password: "rb-secret" }
  }
}
cloudhub_auth {
  base_uri: "fleet7.jaia.tech"
  admin_email: "admin@example.com"
  smtp_address: "smtp://smtp-relay.example.com:587"
}
