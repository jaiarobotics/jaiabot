fleet: 5
hubs: [1, 2]
bots: [1, 2]
ssh {
  hub { id: 1 private_key: "hub1 test key" public_key: "ssh-ed25519 AAAAhub1 hub1" }
  hub { id: 2 private_key: "hub2 test key" public_key: "ssh-ed25519 AAAAhub2 hub2" }
  permanent_authorized_keys: "ssh-ed25519 AAAAperm someone@example"
}
wlan_password: "fleet-wifi-secret"
service_vpn_enabled: false
debconf {
  key: "jaiabot-embedded/comms_links"
  type: MULTISELECT
  value: "wifi"
}
debconf {
  key: "jaiabot-embedded/mode"
  type: SELECT
  value: "runtime"
}
