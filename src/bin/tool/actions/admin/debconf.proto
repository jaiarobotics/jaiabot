syntax = "proto2";
import "goby/middleware/protobuf/app_config.proto";
import "goby/protobuf/option_extensions.proto";

package jaiabot.config.admin;

message DebconfTool
{
    option (goby.msg).cfg.tool = {
        is_tool: true
        has_subtools: true
        has_help_action: true
    };

    optional goby.middleware.protobuf.AppConfig app = 1
        [(goby.field) = { cfg { action: DEVELOPER } }];

    enum Action
    {
        help = 0 [(goby.ev).cfg = {
            short_help_msg: "Print usage information",
            full_help_msg: "Usage: \"jaia admin debconf help [action]\""
        }];
        get = 1 [(goby.ev).cfg = {
            short_help_msg: "Read a jaiabot-embedded debconf value",
            full_help_msg: "Read one of this bot/hub's configuration values.\n"
                           "Usage: \"jaia admin debconf get <question>\"\n"
                           "e.g. \"jaia admin debconf get fleet_id\"\n"
                           "Run \"jaia admin debconf list\" for the available questions."
        }];
        set = 2 [(goby.ev).cfg = {
            short_help_msg: "Write a jaiabot-embedded debconf value and apply it",
            full_help_msg: "Change one of this bot/hub's configuration values.\n"
                           "Usage: \"jaia admin debconf set <question> <value> [--reconfigure false]\"\n"
                           "e.g. \"jaia admin debconf set fleet_id 3\"\n"
                           "By default this reconfigures jaiabot-embedded so the systemd units are\n"
                           "regenerated; pass --reconfigure false to set several values first.\n"
                           "Run \"jaia admin debconf list\" for the available questions and values."
        }];
        list = 3 [(goby.ev).cfg = {
            short_help_msg: "List the questions that get and set accept",
            full_help_msg: "List every question the jaiabot-embedded package defines, with its\n"
                           "type, default and permitted choices.\n"
                           "Usage: \"jaia admin debconf list [--all]\"\n"
                           "This reads the package's templates rather than the debconf database,\n"
                           "so it shows what can be set (and does not require root) - use\n"
                           "\"jaia admin debconf get\" to read what a question is currently set to."
        }];
    }
    optional Action action = 2 [
        default = help,
        (goby.field) = {
            description: "The action this tool should take [can omit --action if 1st parameter]",
            cfg { position: { enable: true }, cli_short: "A", action: HIDDEN }
        }
    ];
}
