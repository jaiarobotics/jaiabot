syntax = "proto2";
import "goby/middleware/protobuf/app_config.proto";
import "goby/protobuf/option_extensions.proto";

package jaiabot.config.admin.fleet;

message SupportAuthorizeTool
{
    option (goby.msg).cfg.tool = {
        is_tool: true
        has_subtools: false
        has_help_action: false
    };

    optional goby.middleware.protobuf.AppConfig app = 1
        [(goby.field) = { cfg { action: DEVELOPER } }];

    required uint32 fleet = 2 [(goby.field) = {
        description: "Fleet to reach, whose CloudHub is chf<fleet>",
        cfg { position { enable: true } }
    }];

    required string support_key = 3 [(goby.field) = {
        description: "ID of the Jaia support desktop compiled into this tool, e.g. jaia@support_example",
        cfg { position { enable: true } }
    }];

    optional string pubkey = 4 [(goby.field) = {
        description: "SSH key to authorize on every bot and hub: either the full public key or the ID of one compiled into this tool. Not used with --rm",
        cfg { position { enable: true } }
    }];

    optional bool rm = 5 [
        default = false,
        (goby.field) = {
            description: "If true, end the grant rather than make it (the default)"
        }
    ];

    optional uint32 valid_for_days = 6 [
        default = 7,
        (goby.field) = {
            description: "Days of access, at most 14 and never beyond what the customer approved"
        }
    ];
}
