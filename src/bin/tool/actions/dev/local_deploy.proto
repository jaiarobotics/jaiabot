syntax = "proto2";
import "goby/middleware/protobuf/app_config.proto";
import "goby/protobuf/option_extensions.proto";

package jaiabot.config.dev;

message LocalDeployTool
{
    option (goby.msg).cfg.tool = {
        is_tool: true
        has_subtools: false
        has_help_action: false
    };

    optional goby.middleware.protobuf.AppConfig app = 1
        [(goby.field) = { cfg { action: DEVELOPER } }];

    repeated string target = 2 [(goby.field) = {
        description: "Bot or hub to deploy to, either a host code (e.g. b1f6, h1f6) or an inclusive range of them (e.g. b1f6..b3f6). At least one target is required",
        cfg { position { enable: true, max_count: -1 } }
    }];

    optional int32 fleet = 3 [(goby.field) = {
        description: "Fleet ID for targets given without an 'fN' suffix, e.g. 'jaia dev local_deploy b1..b3 h1 --fleet 6'",
        cfg { cli_short: "f" }
    }];

    enum Repo
    {
        release = 0;
        continuous = 1;
        beta = 2;
        test = 3;
    }
    optional Repo repo = 4 [
        default = release,
        (goby.field) = {
            description: "Package repository to use for the 'apt' dependencies installed in the build container"
        }
    ];

    enum MachineType
    {
        embedded = 0;
        virtualbox = 1;
    }
    optional MachineType machine_type = 5 [
        default = embedded,
        (goby.field) = {
            description: "Machine to build for: 'embedded' for the arm64 Raspberry Pi targets, or 'virtualbox' for amd64 virtual machines"
        }
    ];
}
