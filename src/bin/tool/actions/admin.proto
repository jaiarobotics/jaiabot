syntax = "proto2";
import "goby/middleware/protobuf/app_config.proto";
import "goby/protobuf/option_extensions.proto";

package jaiabot.config;

message AdminTool
{
    option (goby.msg).cfg.tool = {
        is_tool: true
        has_subtools: true
        has_help_action: true
    };

    optional goby.middleware.protobuf.AppConfig app = 1
        [(goby.field) = { cfg { action: DEVELOPER } }];

    enum Action
    {
        help = 0 [(goby.ev).cfg = {
            short_help_msg: "Print usage information",
            full_help_msg: "Usage: \"jaia admin help [action]\""
        }];
        ssh = 1 [(goby.ev).cfg = {
            short_help_msg: "SSH key administration",
        }];
        fleet = 2 [(goby.ev).cfg = {
            short_help_msg: "Fleet administration",
        }];
        debconf = 3 [(goby.ev).cfg = {
            short_help_msg: "Read and write this bot/hub's debconf configuration",
        }];
        bounds = 4 [(goby.ev).cfg = {
            short_help_msg: "Output the valid ranges of the bot, hub and fleet ids",
            external_command: "jaia_bounds"
            include_binary_flag: false
            full_help_msg: "Reports the id ranges that the Jaia addressing scheme defines, so that a caller does not have to hardcode them.\n"
                           "Example commands:\n"
                           "  jaia admin bounds: every range, e.g. \"bot id: [0 150]\"\n"
                           "  jaia admin bounds --bot_id --max: the highest bot id, as a bare number for a script to use\n"
                           "  jaia admin bounds --format json: every range as a JSON object\n"
                           "\n"
                           "This action runs the standalone 'jaia_bounds' tool, which can be called directly (as 'jaia_bounds') from non-interactive scripts to avoid the startup cost of the 'jaia' tool. Run 'jaia_bounds --help' for the full list of options.\n"
        }];
    }
    optional Action action = 2 [
        default = help,
        (goby.field) = {
            description: "The action this tool should take [can omit --action if 1st parameter]",
            cfg { position: { enable: true }, cli_short: "A", action: HIDDEN }
        }
    ];
}
