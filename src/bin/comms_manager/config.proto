syntax = "proto2";

import "goby/middleware/protobuf/app_config.proto";
import "goby/zeromq/protobuf/interprocess_config.proto";
import "jaiabot/messages/link.proto";
import "dccl/option_extensions.proto";

package jaiabot.config;

message CommsManager
{
    option (dccl.msg) = {
        unit_system: "si"
    };

    optional goby.middleware.protobuf.AppConfig app = 1;
    optional goby.zeromq.protobuf.InterProcessPortalConfig interprocess = 2;

    message SubscribeRule
    {
        required jaiabot.protobuf.Link link = 1;
        required bool subscribe_on_start = 2;
        required bool resubscribe = 3;
        optional int32 resubscribe_interval = 4
            [(dccl.field).units = { base_dimensions: "T" }];
    }

    repeated SubscribeRule subscribe = 3;

    required uint32 subnet_mask = 4;
}
