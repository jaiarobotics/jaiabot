        <title>Jaia Command & Control</title>

        <style>
            /* Loading screen styles */
            #initial-loading-screen {
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                background-color: white;
                display: flex;
                justify-content: center;
                align-items: center;
                z-index: 9999;
            }

            #initial-loading-content {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 2rem;
            }

            #initial-loading-logo {
                width: 300px;
                max-width: 300px;
                height: auto;
                animation:
                    fadeIn 0.5s ease-in,
                    sheen 2s ease-in-out 0.5s infinite;
            }

            #initial-loading-bar-container {
                width: 300px;
                height: 8px;
                background-color: #e0e0e0;
                border-radius: 4px;
                overflow: hidden;
            }

            #initial-loading-bar {
                height: 100%;
                background-color: #cc0505;
                width: 10%;
                border-radius: 4px;
                transition: width 0.5s ease-out;
            }

            @keyframes fadeIn {
                from {
                    opacity: 0;
                }
                to {
                    opacity: 1;
                }
            }

            @keyframes sheen {
                0% {
                    filter: brightness(1);
                }
                50% {
                    filter: brightness(1.2);
                }
                100% {
                    filter: brightness(1);
                }
            }
        </style>
    </head>

        <script>
            // Stream client.js via fetch() to track real byte-level download progress,
            // then inject it as a blob URL so the bundle is only downloaded once.
            // Using a blob URL avoids relying on browser HTTP cache sharing between
            // fetch() and <script> request destinations (which is not guaranteed).
            //
            // The uncompressed file size is injected at build time by HtmlWebpackPlugin.
            // response.body.getReader() yields decompressed bytes, which equals the
            // uncompressed size — so the progress ratio is accurate regardless of whether
            // the server applies gzip compression.
            //
            // webpack publicPath is set to "./" so lazy chunk URLs resolve correctly
            // against the document URL even when client.js loads from a blob: URL.
            //
            // CSP note: blob: must be allowed in script-src if a Content-Security-Policy
            // is ever added. The .catch() fallback injects <script src="client.js">
            // directly, which only requires 'self', in case fetch() fails.
            //
            // inject:false in HtmlWebpackPlugin prevents webpack from also emitting a
            // <script> tag, which would cause double execution.
            (function () {
                var progressBar = document.getElementById('initial-loading-bar');

                function updateProgress(pct) {
                    if (progressBar) progressBar.style.width = Math.min(pct, 95) + '%';
                }

                function injectClientScript() {
                    var s = document.createElement('script');
                    s.src = 'client.js';
                    document.head.appendChild(s);
                }

                updateProgress(5);

                fetch('client.js')
                    .then(function (response) {
                        if (!response.ok || !response.body) throw new Error('fetch failed');
                        // Uncompressed size injected at build time. The reader yields
                        // decompressed bytes, so this total is always accurate even when
                        // the server sends Content-Encoding: gzip.
                        var total = <%= compilation.assets['client.js'] ? compilation.assets['client.js'].size() : 0 %>;
                        var reader = response.body.getReader();
                        var chunks = [];
                        var loaded = 0;

                        function pump() {
                            return reader.read().then(function (result) {
                                if (result.done) {
                                    updateProgress(90);
                                    // Inject via blob URL — guaranteed single download,
                                    // no reliance on browser HTTP cache sharing between
                                    // fetch() and <script> request destinations.
                                    var blob = new Blob(chunks, { type: 'application/javascript' });
                                    var url = URL.createObjectURL(blob);
                                    var s = document.createElement('script');
                                    s.onload = function () { URL.revokeObjectURL(url); };
                                    s.src = url;
                                    document.head.appendChild(s);
                                    return;
                                }
                                chunks.push(result.value);
                                loaded += result.value.byteLength;
                                if (total > 0) updateProgress(5 + (loaded / total) * 85);
                                return pump();
                            });
                        }
                        return pump();
                    })
                    .catch(injectClientScript); // fetch failed or unsupported — inject directly
            })();
        </script>
