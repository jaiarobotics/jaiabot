<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
        />
        <link rel="manifest" href="/manifest.json" />
        <link rel="shortcut icon" href="/favicon.png" />

        <title>Jaia Command & Control</title>
        <style>
            /* Loading screen styles - inline to show immediately */
            #initial-loading-screen {
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                background-color: white;
                display: flex;
                justify-content: center;
                align-items: center;
                z-index: 9999;
            }

            #initial-loading-content {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 2rem;
            }

            #initial-loading-logo {
                width: 300px;
                height: auto;
                animation: fadeIn 0.5s ease-in;
            }

            #initial-loading-bar-container {
                width: 300px;
                height: 8px;
                background-color: #e0e0e0;
                border-radius: 4px;
                overflow: hidden;
            }

            #initial-loading-bar {
                height: 100%;
                background-color: #cc0505;
                animation: loadingProgress 2s ease-in-out infinite;
                border-radius: 4px;
            }

            #initial-loading-text {
                font-family: "Helvetica Neue", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
                font-size: 1.2rem;
                color: black;
                animation: pulse 1.5s ease-in-out infinite;
            }

            @keyframes loadingProgress {
                0% { width: 0%; }
                50% { width: 70%; }
                100% { width: 100%; }
            }

            @keyframes fadeIn {
                from { opacity: 0; }
                to { opacity: 1; }
            }

            @keyframes pulse {
                0%, 100% { opacity: 1; }
                50% { opacity: 0.5; }
            }
        </style>
    </head>

    <body>
        <!-- Initial loading screen shown immediately before JavaScript loads -->
        <div id="initial-loading-screen">
            <div id="initial-loading-content">
                <svg id="initial-loading-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1056 816">
                    <g transform="matrix(1.3333333,0,0,-1.3333333,0,816)">
                        <g transform="translate(294.1519,283.8105)">
                            <path d="m 0,0 c -2.804,0 -5.653,0.501 -8.55,1.5 -2.902,0.998 -5.452,2.597 -7.65,4.8 -2.203,2.198 -4.003,5.048 -5.401,8.55 -1.401,3.497 -2.099,7.65 -2.099,12.449 v 58.8 h 13.8 v -56.7 c 0,-6.403 1.148,-10.95 3.45,-13.649 2.297,-2.7 4.846,-4.051 7.65,-4.051 h 2.1 c 2.799,0 5.348,1.351 7.65,4.051 2.297,2.699 3.449,7.246 3.449,13.649 V 211.5 H 28.2 V 27.299 C 28.2,22.5 27.497,18.347 26.1,14.85 24.698,11.348 22.847,8.498 20.55,6.3 18.248,4.097 15.698,2.498 12.899,1.5 10.097,0.501 7.298,0 4.5,0 Z" style="fill:#231f20" />
                        </g>
                        <g transform="translate(363.4507,355.8101)">
                            <path d="M 0,0 H 19.5 L 9.9,99.6 H 9.601 Z M 20.7,-10.5 H -1.199 l -5.7,-59.7 h -12.3 L 1.2,139.5 h 18 L 39.901,-70.2 H 26.4 Z" style="fill:#231f20" />
                        </g>
                        <path d="m 439.949,285.61 h -13.801 v 209.7 h 13.801 z" style="fill:#ed1c24" />
                        <g transform="translate(481.6484,355.8101)">
                            <path d="M 0,0 H 19.5 L 9.9,99.6 H 9.6 Z M 20.699,-10.5 H -1.199 L -6.9,-70.2 H -19.199 L 1.199,139.5 h 18 L 39.9,-70.2 H 26.4 Z" style="fill:#231f20" />
                        </g>
                    </g>
                </svg>
                <div id="initial-loading-bar-container">
                    <div id="initial-loading-bar"></div>
                </div>
                <div id="initial-loading-text">Loading Jaia Command & Control...</div>
            </div>
        </div>
        <div id="root"></div>
    </body>
</html>
