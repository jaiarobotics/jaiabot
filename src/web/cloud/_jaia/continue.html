<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noindex, nofollow" />
        <title>Continue</title>
        <link rel="icon" href="/_jaia/logo.svg" />
        <link rel="stylesheet" href="/_jaia/support.css" />
        <link rel="stylesheet" href="/_jaia/nav.css" />
        <script defer src="/_jaia/nav.js"></script>
        <script defer src="/_jaia/continue.js"></script>
    </head>

    <body>
        <h1>Continue to <span data-jaia-site>this site</span></h1>
        <p>
            Links in email are often opened by a mail scanner before they reach you, and this one
            works only once. Press the button to carry on; nothing happens until you do.
        </p>
        <p><button type="button" data-jaia-continue>Continue</button></p>
        <noscript>
            <p class="banner none">
                This page needs JavaScript. Without it, add <code>&amp;confirmed=1</code> to the end
                of the address in the address bar and press Enter.
            </p>
        </noscript>
    </body>
</html>
