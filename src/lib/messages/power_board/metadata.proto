syntax = "proto2";

import "dccl/option_extensions.proto";
import "nanopb.proto";

package jaiabot.protobuf;

message Metadata {
    option (dccl.msg) = {
        unit_system: "si"
    };

    required uint64 time = 1 [
        (dccl.field) = { units { prefix: "micro" derived_dimensions: "time" } }
    ];

    optional bool init_failed = 20;
    optional int32 power_board_version = 21;
}