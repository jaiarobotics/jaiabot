syntax = "proto2";
import "jaiabot/messages/option_extensions.proto";

package jaiabot.protobuf;

// Fleet config contract version: see "Fleet configuration versioning" in
// page091_major_upgrade.md. Bump it together with a migration in
// jaia-fleet-config.py when the build-time contract check reports a breaking
// change. Fields and enum values are never removed or renamed, only marked
// [deprecated = true], so that every earlier version still parses.
option (jaia.file).fleet_config_version = 2;

// The bot/hub settings that debconf asks for on first boot and on
// "dpkg-reconfigure jaiabot-embedded". debian/jaiabot-embedded.templates and
// .config are generated from this message: fields are asked in declaration
// order, grouped by (jaia.field).debconf.group, and enum values map to debconf
// values by dropping the enum name prefix and lowercasing (BOT_TYPE_PAM -> pam).
message NodeSettings
{
    option (jaia.msg).debconf = {
        package: "jaiabot-embedded"
        node_type_field: "type"
    };

    enum NodeType
    {
        NODE_TYPE_BOT = 0;
        NODE_TYPE_HUB = 1;
    }
    optional NodeType type = 1 [(jaia.field).debconf = {
        group: ALL
        identity: true
        priority: HIGH
        description: "Is this a bot or a hub?"
        extended_description: "This choice will determine which applications will be configured to launch with systemd."
    }];

    optional int32 fleet_id = 2 [(jaia.field).debconf = {
        group: ALL
        identity: true
        priority: HIGH
        range { min: 0 max: 250 }
        description: "Fleet identification number"
        extended_description: "This is used to set the correct value in the jaiabot configuration.\nTo change in the future, run \"sudo dpkg-reconfigure jaiabot-embedded\""
    }];

    enum LedType
    {
        LED_TYPE_HUB_LED = 0;
        LED_TYPE_NONE = 1;
    }
    optional LedType led_type = 3 [
        default = LED_TYPE_NONE,
        (jaia.field).debconf = {
            group: ALL
            priority: HIGH
            description: "What type of leds does your system have?"
        }
    ];

    optional int32 electronics_stack = 4 [
        default = 0,
        (jaia.field).debconf = {
            group: ALL
            priority: HIGH
            choices: [ "0", "1", "2" ]
            description: "What type of electronics stack do you have?"
        }
    ];

    optional string rf_encryption_password = 5 [
        default = "",
        (jaia.field).debconf = {
            group: ALL
            priority: MEDIUM
            description: "Encryption key for XBee radio: 128-bit value (up to 16 bytes) as hex"
        }
    ];

    optional string dccl_encryption_password = 6 [
        default = "",
        (jaia.field).debconf = {
            group: ALL
            priority: MEDIUM
            description: "Encryption passphrase for DCCL (intervehicle) messages: can be any string."
        }
    ];

    enum CommsLink
    {
        COMMS_LINK_XBEE = 0;
        COMMS_LINK_WIFI = 1;
        COMMS_LINK_IRIDIUM = 2;
    }
    repeated CommsLink comms_links = 7 [(jaia.field).debconf = {
        group: ALL
        priority: MEDIUM
        default: "xbee"
        description: "Which comms links to activate?"
    }];

    enum Mode
    {
        MODE_RUNTIME = 0;
        MODE_SIMULATION = 1;
    }
    optional Mode mode = 8 [
        default = MODE_RUNTIME,
        (jaia.field).debconf = {
            group: ALL
            identity: true
            priority: MEDIUM
            description: "Is this bot or hub to be run in runtime (operational) or simulation mode?"
            extended_description: "This choice will determine which applications will be configured to launch with systemd."
        }
    ];

    optional int32 warp = 9 [
        default = 1,
        (jaia.field).debconf = {
            group: ALL
            priority: MEDIUM
            choices: [ "1", "2", "5", "10", "20", "30", "40", "50" ]
            ask_if { field: "mode" equals: "simulation" }
            description: "At what multiple of real speed should this simulation be run?"
            extended_description: "A value of 1 is normal speed, 10 is 10x the real clock, etc."
        }
    ];

    optional int32 bot_id = 10 [(jaia.field).debconf = {
        group: BOT
        identity: true
        priority: HIGH
        range { min: 0 max: 150 }
        description: "Bot identification number"
        extended_description: "This is used to set the hostname of the computer and set the correct value in the jaiabot configuration.\nTo change in the future, run \"sudo dpkg-reconfigure jaiabot-embedded\""
    }];

    enum ArduinoType
    {
        ARDUINO_TYPE_SPI = 0;
        ARDUINO_TYPE_USB = 1;
        ARDUINO_TYPE_NONE = 2;
        ARDUINO_TYPE_USB_OLD = 3 [deprecated = true, (jaia.ev).debconf.replaced_by = "usb"];
        ARDUINO_TYPE_USB_NEW = 4 [deprecated = true, (jaia.ev).debconf.replaced_by = "usb"];
    }
    optional ArduinoType arduino_type = 11 [
        default = ARDUINO_TYPE_NONE,
        (jaia.field).debconf = {
            group: BOT
            priority: HIGH
            description: "What type of Arduino connection does this bot have?"
        }
    ];

    enum BotType
    {
        BOT_TYPE_HYDRO = 0;
        BOT_TYPE_PAM = 1;
        BOT_TYPE_BIO = 2;
        BOT_TYPE_NONE = 3;
        BOT_TYPE_ECHO = 4 [deprecated = true, (jaia.ev).debconf.replaced_by = "pam"];
    }
    optional BotType bot_type = 12 [
        default = BOT_TYPE_HYDRO,
        (jaia.field).debconf = {
            group: BOT
            priority: HIGH
            unasked_value: "none"
            description: "What type of bot is your system?"
        }
    ];

    enum PamConnectionType
    {
        PAM_CONNECTION_TYPE_UART = 0;
        PAM_CONNECTION_TYPE_USB = 1;
        PAM_CONNECTION_TYPE_NONE = 2;
    }
    optional PamConnectionType pam_connection_type = 13 [
        default = PAM_CONNECTION_TYPE_NONE,
        (jaia.field).debconf = {
            group: BOT
            priority: HIGH
            ask_if { field: "bot_type" equals: "pam" }
            unasked_value: "none"
            description: "What type of PAM connection does this bot have?"
        }
    ];

    enum ImuType
    {
        IMU_TYPE_BNO055 = 0;
        IMU_TYPE_BNO085 = 1;
        IMU_TYPE_NONE = 2;
    }
    optional ImuType imu_type = 14 [
        default = IMU_TYPE_BNO055,
        (jaia.field).debconf = {
            group: BOT
            priority: HIGH
            description: "What type of imu does your system have?"
        }
    ];

    enum DataOffloadIgnoreType
    {
        DATA_OFFLOAD_IGNORE_TYPE_GOBY = 0;
        DATA_OFFLOAD_IGNORE_TYPE_TASKPACKET = 1;
        DATA_OFFLOAD_IGNORE_TYPE_NONE = 2;
    }
    optional DataOffloadIgnoreType data_offload_ignore_type = 15 [
        default = DATA_OFFLOAD_IGNORE_TYPE_NONE,
        (jaia.field).debconf = {
            group: BOT
            priority: MEDIUM
            description: "What data types to ignore when sending data to the hub?"
        }
    ];

    enum ImuInstallType
    {
        IMU_INSTALL_TYPE_EMBEDDED = 0;
        IMU_INSTALL_TYPE_RETROFIT = 1;
        IMU_INSTALL_TYPE_NONE = 2;
    }
    optional ImuInstallType imu_install_type = 16 [
        default = IMU_INSTALL_TYPE_EMBEDDED,
        (jaia.field).debconf = {
            group: BOT
            priority: MEDIUM
            description: "What type of imu installation does your system have?"
        }
    ];

    enum TemperatureSensorType
    {
        TEMPERATURE_SENSOR_TYPE_BAR02 = 0;
        TEMPERATURE_SENSOR_TYPE_BAR30 = 1;
        TEMPERATURE_SENSOR_TYPE_TSYS01 = 2;
        TEMPERATURE_SENSOR_TYPE_NONE = 3;
    }
    optional TemperatureSensorType temperature_sensor_type = 17 [
        default = TEMPERATURE_SENSOR_TYPE_BAR30,
        (jaia.field).debconf = {
            group: BOT
            priority: MEDIUM
            description: "What temperature sensor do you want to use?"
        }
    ];

    enum PressureSensorType
    {
        PRESSURE_SENSOR_TYPE_BAR02 = 0;
        PRESSURE_SENSOR_TYPE_BAR30 = 1;
        PRESSURE_SENSOR_TYPE_NONE = 2;
    }
    optional PressureSensorType pressure_sensor_type = 18 [
        default = PRESSURE_SENSOR_TYPE_BAR30,
        (jaia.field).debconf = {
            group: BOT
            priority: MEDIUM
            description: "What pressure sensor do you have?"
        }
    ];

    enum MotorHarnessType
    {
        MOTOR_HARNESS_TYPE_RPM_AND_THERMISTOR = 0;
        MOTOR_HARNESS_TYPE_NONE = 1;
    }
    optional MotorHarnessType motor_harness_type = 19 [
        default = MOTOR_HARNESS_TYPE_NONE,
        (jaia.field).debconf = {
            group: BOT
            priority: MEDIUM
            description: "What type of motor harness does your bot have?"
        }
    ];

    enum CameraPosition
    {
        CAMERA_POSITION_AFT = 0;
        CAMERA_POSITION_FORE = 1;
        CAMERA_POSITION_OUTWARD = 2;
        CAMERA_POSITION_NONE = 3;
    }
    repeated CameraPosition camera_positions = 20 [(jaia.field).debconf = {
        group: BOT
        priority: MEDIUM
        default: "none"
        description: "Which camera positions?"
    }];

    enum AdditionalSensor
    {
        ADDITIONAL_SENSOR_TURNER_C_FLOUR = 0;
        ADDITIONAL_SENSOR_AML = 1;
        ADDITIONAL_SENSOR_PPK = 2;
        ADDITIONAL_SENSOR_NONE = 3;
    }
    repeated AdditionalSensor additional_sensors = 21 [(jaia.field).debconf = {
        group: BOT
        priority: MEDIUM
        default: "none"
        description: "Which additional sensors?"
    }];

    optional int32 hub_id = 22 [(jaia.field).debconf = {
        group: HUB
        identity: true
        priority: HIGH
        range { min: 0 max: 30 }
        description: "Hub identification number"
        extended_description: "This is used to set the hostname of the computer and set the correct value in the jaiabot configuration.\nTo change in the future, run \"sudo dpkg-reconfigure jaiabot-embedded\""
    }];

    enum UserRole
    {
        USER_ROLE_USER = 0;
        USER_ROLE_ADVANCED = 1;
        USER_ROLE_DEVELOPER = 2;
    }
    optional UserRole user_role = 23 [
        default = USER_ROLE_USER,
        (jaia.field).debconf = {
            group: HUB
            priority: MEDIUM
            description: "The user role to be set in the Upgrade UI (this sets which Ansible playbooks are visible to the user)."
        }
    ];
}

message FleetConfig
{
    // Version of the contract this file was written for; files that predate
    // the field are version 1
    optional uint32 version = 10 [default = 1];

    required int32 fleet = 1;
    repeated int32 hubs = 2;
    repeated int32 bots = 3;

    message SSHKeys
    {
        repeated string permanent_authorized_keys = 1;
        message HubKey
        {
            required int32 id = 1;
            required string private_key = 2;
            required string public_key = 3;
        }
        repeated HubKey hub = 2;
        message VPNTempKey
        {
            required string private_key = 2;
            required string public_key = 3;
        }
        optional VPNTempKey vpn_tmp = 3;
    }
    required SSHKeys ssh = 4;

    // Settings common to every node in the fleet; identity fields (type, ids,
    // mode) are supplied per node and must not be set here
    optional NodeSettings settings = 12;

    message NodeOverride
    {
        required DebconfOverride.NodeType type = 1;
        required int32 id = 2;
        // Fields set here replace the common value for this node
        required NodeSettings settings = 3;
    }
    repeated NodeOverride override = 13;

    // Version 1 form of settings and override, migrated to NodeSettings
    message Debconf
    {
        enum DebconfType
        {
            SELECT = 0;
            MULTISELECT = 1;
            STRING = 2;
            BOOLEAN = 3;
            NOTE = 4;
            TEXT = 5;
            PASSWORD = 6;
        }

        required string key = 1;
        optional DebconfType type = 2 [default = SELECT];
        required string value = 3;
    }
    repeated Debconf debconf = 5 [deprecated = true];
    required string wlan_password = 6;
    required bool service_vpn_enabled = 7;

    message DebconfOverride
    {
        enum NodeType
        {
            HUB = 0;
            BOT = 1;
        }

        required NodeType type = 1;
        required int32 id = 2;
        repeated Debconf debconf = 3;
    }
    repeated DebconfOverride debconf_override = 8 [deprecated = true];


    message Communications
    {
        message IridiumSBD
        {
            message BotToIMEI
            {
                required int32 id = 1;
                required string imei = 2;
            }
            repeated BotToIMEI bot = 1;
            // Matches enum in Goby driver
            enum SBDType
            {
                SBD_DIRECTIP = 1;
                SBD_ROCKBLOCK = 2;
            }
            required SBDType sbd_type = 2;
            message RockBLOCKParams
            {
                required string username = 1;
                required string password = 2;
            }
            optional RockBLOCKParams rockblock = 3;
        }
        optional IridiumSBD iridium_sbd = 1;
    }
    optional Communications comms = 9;

    message CloudHubAuth
    {
        required string base_uri = 1;
        required string admin_email = 2;
        required string smtp_address = 3;
    }
    optional CloudHubAuth cloudhub_auth = 11;
}
