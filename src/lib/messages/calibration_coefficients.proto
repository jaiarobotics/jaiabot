syntax = "proto2";

import "dccl/option_extensions.proto";

package jaiabot.protobuf;

message Fluorometer {
    optional string fluorometer_offset = 1;
    optional string fluorometer_calibration_coefficient = 2;
    optional string fluorometer_serial_number = 3;
}

message CalibrationCoefficients {
    optional Fluorometer fluorometer = 1;
}
