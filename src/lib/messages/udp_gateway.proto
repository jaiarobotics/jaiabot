syntax="proto2";
import "jaiabot/messages/imu.proto";
import "jaiabot/messages/sensor/salinity.proto";
import "jaiabot/messages/sensor/pressure_temperature.proto";
import "jaiabot/messages/tsys01.proto";
import "jaiabot/messages/echo.proto";
import "jaiabot/messages/ppk.proto";
import "jaiabot/messages/icas.proto";

package jaiabot.protobuf;


message UDPGatewayEnvelope
{
    oneof payload
    {
        IMUCommand imu_command = 1;
        IMUData imu_data = 2;

        SalinityData salinity_data = 3;

        PressureTemperatureData pressure_temperature_data = 4;

        TSYS01Data tsys01_data = 5;

        EchoCommand echo_command = 6;
        EchoData echo_data = 7;

        // jaiabot_ubx_ppk.py
        UBXChunk ubx_chunk = 8;

        // jaiabot_icas.py
        ICASData icas_data = 9;
        ICASAdcData icas_adc_data = 10;
        ICASStatus icas_status = 11;
        ICASMetadata icas_metadata = 12;
    }

}

