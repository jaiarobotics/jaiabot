syntax = "proto2";

import "dccl/option_extensions.proto";

package jaiabot.sensor.protobuf;

message AML {
    option (dccl.msg) = {
        unit_system: "si"
    };

    enum Sensor {
        DEFAULT = 1;
        CONDUCTIVITY = 2;
        // SOUND_VELOCITY = 3;
    }

    optional Sensor sensor = 1;
    optional double conductivity = 2 [(dccl.field) = {
        units { derived_dimensions: "conductivity" system: "si" }
    }];;
    optional double temperature = 3 [(dccl.field) = {
        units { derived_dimensions: "temperature" system: "celsius" }
    }];;
}