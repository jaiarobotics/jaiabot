syntax = "proto2";

import "goby/acomms/protobuf/modem_message.proto";

package jaiabot.protobuf;

// Extra fields attached to each received goby ModemTransmission by the XBee driver.
// Published on the goby::middleware::intervehicle::groups::modem_receive interprocess group.
message Transmission
{
    // RSSI of the received packet in -dBm (e.g. 65 = -65 dBm).
    // Populated by the XBee driver from the DB AT command response.
    optional int32 rssi = 1;
}

extend goby.acomms.protobuf.ModemTransmission
{
    optional Transmission transmission = 1500;
}
