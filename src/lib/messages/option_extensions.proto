syntax = "proto2";

import "google/protobuf/descriptor.proto";

package jaia;

message RestAPI
{
    enum Presence
    {
        NOT_GUARANTEED = 0;
        GUARANTEED = 1;
        OMITTED = 2;
    }
    optional Presence presence = 1 [default = NOT_GUARANTEED];
    optional string doc = 2;
    message Example
    {
        required string request = 1;
        required string response = 2;
    }
    optional Example example = 3;

    // used by APIConfig permissions to map permission onto allowed actions
    repeated string permitted_action = 4;
}

// How a NodeSettings field is asked by debconf. debian/jaiabot-embedded.templates and
// .config are generated from these, in field declaration order.
message DebconfField
{
    enum Group
    {
        ALL = 1;
        BOT = 2;
        HUB = 3;
    }
    enum Priority
    {
        LOW = 1;
        MEDIUM = 2;
        HIGH = 3;
    }
    required Group group = 1;
    // Asked on the node but never stored in a fleet config: the fleet config tool
    // supplies it from the node's own identity (type, ids, mode)
    optional bool identity = 2 [default = false];
    // MEDIUM keeps a question debconf has never asked out of an interactive
    // "apt upgrade"; dpkg-reconfigure asks every question whatever this says
    optional Priority priority = 3 [default = MEDIUM];
    optional string description = 4;
    // Lines of the extended description
    optional string extended_description = 5;
    message AskIf
    {
        required string field = 1;
        required string equals = 2;
    }
    optional AskIf ask_if = 6;
    // Set when the question is skipped (ask_if false, or the node is not in the
    // group); a node holding this value when the question *is* asked is reset to
    // the default
    optional string unasked_value = 7;
    // Choices for integer fields, in order
    repeated string choices = 8;
    // Asked as a string and checked against "jaia_bounds --<field>": the run of
    // valid ids is too long to offer as Choices
    optional bool bounded_id = 9 [default = false];
    // Default for repeated (multiselect) fields, which have no proto default
    optional string default = 10;
    // Different on every node (a serial number, a VIN): asked once per bot or
    // hub and stored in that node's override, never in the common settings
    optional bool per_node = 11 [default = false];
}

message DebconfValue
{
    // debconf value; defaults to the enum value name without the enum name
    // prefix, lowercased (BOT_TYPE_PAM -> "pam")
    optional string value = 1;
    // For deprecated values: the value they are normalised to
    optional string replaced_by = 2;
}

message DebconfMessage
{
    required string package = 1;
    // Field whose value (bot/hub) selects the BOT or HUB question group
    required string node_type_field = 2;
}

message FieldOptions
{
    optional RestAPI rest_api = 1;
    optional DebconfField debconf = 2;
}
message MessageOptions
{
    optional DebconfMessage debconf = 1;
}
message EnumValueOptions
{
    optional RestAPI rest_api = 1;
    optional DebconfValue debconf = 2;
}
message FileOptions
{
    // See "Fleet configuration versioning" in page091_major_upgrade.md
    optional uint32 fleet_config_version = 1;
}

// we can use 1252 for all extensions:
// https://github.com/protocolbuffers/protobuf/commit/46f7879cae6a986ca0f780811dc8414ae14d18d5

extend .google.protobuf.FieldOptions
{
    optional .jaia.FieldOptions field = 1252;
}

extend .google.protobuf.MessageOptions
{
    optional .jaia.MessageOptions msg = 1252;
}

extend .google.protobuf.EnumValueOptions
{
    optional .jaia.EnumValueOptions ev = 1252;
}

extend .google.protobuf.FileOptions
{
    optional .jaia.FileOptions file = 1252;
}
