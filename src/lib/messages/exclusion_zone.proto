syntax = "proto2";

import "dccl/option_extensions.proto";
import "jaiabot/messages/geographic_coordinate.proto";
import "jaiabot/messages/option_extensions.proto";

package jaiabot.protobuf;

// A single exclusion zone polygon
message ExclusionZone
{
    option (dccl.msg).unit_system = "si";

    // Label is not transmitted over radio; used for display only
    optional string label = 1 [(dccl.field).omit = true];

    // Up to 30 vertices per zone.
    // DCCL budget: 30 × 57 bits (GeographicCoordinate) ≈ 215 bytes < 250-byte XBee limit
    repeated GeographicCoordinate vertices = 2 [
        (dccl.field).max_repeat = 30,
        (jaia.field).rest_api.presence = GUARANTEED
    ];
}

