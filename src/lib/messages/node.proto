syntax = "proto2";

import "jaiabot/messages/option_extensions.proto";

package jaiabot.protobuf;

// also must match NodeSettings.type in fleet_config.proto
enum NodeType
{
    HUB = 0;
    BOT = 1;
}

// also must match NodeSettings.bot_type in fleet_config.proto
enum BotType
{
    HYDRO = 1 [(jaia.ev).rest_api.presence = GUARANTEED];
    PAM = 2 [(jaia.ev).rest_api.presence = GUARANTEED];
    BIO = 3 [(jaia.ev).rest_api.presence = GUARANTEED];
    STORM = 4 [(jaia.ev).rest_api.presence = GUARANTEED];
}
