syntax = "proto2";

import "dccl/option_extensions.proto";
import "jaiabot/messages/jaia_dccl.proto";

package jaiabot.protobuf;

message CommandCommsResult
{
    option (dccl.msg) = {
        unit_system: "si"
    };

    required Command orig_command = 1;
    enum CommsResult
    {
        SUCCESS = 1;
        FAILURE = 2;
    }
    required CommsResult result = 2;
}
