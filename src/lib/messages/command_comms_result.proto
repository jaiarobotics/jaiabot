syntax = "proto2";

import "dccl/option_extensions.proto";
import "jaiabot/messages/jaia_dccl.proto";
import "jaiabot/messages/link.proto";

package jaiabot.protobuf;

message CommandCommsResult
{
    enum CommsResult
    {
        SUCCESS = 1;
        FAILURE = 2;
    }
    required CommsResult result = 1;
    required Link link = 2;
    required Command orig_command = 3;
}
