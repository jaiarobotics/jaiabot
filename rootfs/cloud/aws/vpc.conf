# print result of AWS commands
DEBUG=true

###
### These options affect the resulting CloudHub
###

# 'jaia admin fleet create_cloudhub' renders JAIA_CUSTOMER_NAME, REPO and
# CLOUDHUB_DATA_BUCKET from the fleet config's cloudhub message; set them here only
# when driving create_vpc.sh directly.

# Value of jaia_customer tag to use for all components (to track billing, etc.)
JAIA_CUSTOMER_NAME=jaia

# AWS instance type
INSTANCE_TYPE="t3a.micro"
FLEET_ID=0

# REGION: any region CircleCI copies the AMI into (the aws-sync job's ami_copy_regions)
# https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/CopyingAMIs.html
REGION=us-east-1
AVAILABILITY_ZONE=us-east-1c

# jaiabot-rootfs-gen repo and version
REPO=release

# rootfs full disk size
DISK_SIZE_GB=32

# AWS S3 bucket to store CloudHub data on
# This bucket must already exist (create using 'aws s3 mb' or web console)
CLOUDHUB_DATA_BUCKET="jaia--cloudhub-data--fleet${FLEET_ID}"

# Fleet configuration that must include hub 30
FLEET_CONFIG=/path/to/fleet.cfg

###
### These options affect the machine running create_vpc.sh
###

# if true, make this machine a peer (desktop1) of the CloudHub's VPNs and install /etc/wireguard/wg_jaia_chN.conf.
# Leave false for a customer's CloudHub: the peer stays on it for as long as it runs.
ENABLE_CLIENT_VPN=false

# if true, add cloudhub-fleetN to /etc/hosts at the CloudHub's VPN address (needs ENABLE_CLIENT_VPN=true)
UPDATE_CLIENT_ETC_HOSTS=false

# if set, write the IDs of the created AWS resources to this path as JSON
#OUTPUT_JSON=/tmp/cloudhub.json

# how long any single wait for the CloudHub may take before the script gives up
#WAIT_TIMEOUT_SECONDS=1800

# if set, the name of an IAM policy to attach to the CloudHub's role as its permissions boundary
#CLOUDHUB_PERMISSIONS_BOUNDARY=JaiaCloudHubBoundary
