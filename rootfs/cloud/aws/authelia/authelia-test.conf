# A copy of auth.cloud.jaia.tech for building and tearing down while testing
source ${SCRIPT_PATH}/authelia/authelia.conf

SERVER_NAME=auth.jaiacloud.gobysoft.org
# Allocate one in us-west-2 so DNS survives rebuilds
ELASTIC_IP_ALLOCATION_ID=
IPV6_ADDRESS=2600:1f13:501:a400::7e57
CREATE_NUM_DAILY_BACKUPS=0

AUTH_BASE_DOMAIN=jaiacloud.gobysoft.org
CADDY_ACME_CA=https://acme-staging-v02.api.letsencrypt.org/directory

# A test server takes over nothing
CUTOVER_FROM_INSTANCE_ID=
CUTOVER_ELASTIC_IP_ALLOCATION_ID=
CUTOVER_IPV6_ADDRESS=
