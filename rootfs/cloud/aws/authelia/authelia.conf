DEBUG=true

SERVER_TYPE=authelia
SERVER_NAME=auth.cloud.jaia.tech
ENABLE_TERMINATION_PROTECTION=false

REGION=us-west-2
# default VPC, us-west-2a, with cc_db and data
SUBNET_ID=subnet-f5f17b8d
# Empty: the new server takes the old one's addresses at cutover (authelia/cutover.sh)
ELASTIC_IP_ALLOCATION_ID=
IPV6_ADDRESS=

INSTANCE_TYPE=t4g.micro
DISK_SIZE_GB=16
CREATE_NUM_DAILY_BACKUPS=7
# Created by authelia/create_iam_role.sh
IAM_INSTANCE_PROFILE_NAME=JaiaAuthServerInstanceProfile

# Packages for jaiabot-web-thirdparty (Authelia, LLDAP and Caddy as 3.y CloudHubs run them)
REPO=continuous
INDENTED_ROOT_PUBKEYS=$(sed 's/^/      /' ${SCRIPT_PATH}/../../../config/ssh/root_authorized_keys)

# Sites are auth., lldap., cc., sandbox.cc., launchpad. and data. under this domain
AUTH_BASE_DOMAIN=cloud.jaia.tech
# Empty for Let's Encrypt; https://acme-staging-v02.api.letsencrypt.org/directory while iterating
CADDY_ACME_CA=

AUTH_SMTP_ADDRESS=submission://smtp.postmarkapp.com:587
AUTH_SMTP_SENDER=noreply@auth.jaia.tech
# The CloudHubs' Postmark credentials, kept in us-east-1
AUTH_SMTP_CREDENTIALS_PARAMETER=arn:aws:ssm:us-east-1:120512385734:parameter/jaia/cloudhub/smtp_credentials

# cc_db and data have no sign-in of their own; their security groups admit port 80 only
# from this server's (authelia/upstream-access.sh)
CC_DB_UPSTREAM=172.31.24.45:80
DATA_UPSTREAM=172.31.24.227:80

# The server this one replaces, whose addresses authelia/cutover.sh moves across
CUTOVER_FROM_INSTANCE_ID=i-0f5fc6d72202c4999
CUTOVER_ELASTIC_IP_ALLOCATION_ID=eipalloc-0bd33c475824f4ac7
CUTOVER_IPV6_ADDRESS=2600:1f13:501:a400:30b0:3e1b:d910:1412

function create_security_group_rules()
{
    local SECURITY_GROUP_ID=$1
    for port in 22 80 443; do
        run "" aws ec2 authorize-security-group-ingress --group-id $SECURITY_GROUP_ID --ip-permissions IpProtocol=tcp,FromPort=$port,ToPort=$port,IpRanges='[{CidrIp=0.0.0.0/0}]',Ipv6Ranges='[{CidrIpv6=::/0}]'
        echo ">>>>>> Allowed TCP port $port on Security Group"
    done
}
