DEBUG=true

SERVER_TYPE=authelia
SERVER_NAME=auth.cloud.jaia.tech
ENABLE_TERMINATION_PROTECTION=false

REGION=us-gov-east-1
# default VPC, us-gov-east-1a: the one with an IPv6 /64 (2600:1f15:2b3:e800::/64)
SUBNET_ID=subnet-024d29243f53fa701
# Allocate in us-gov-east-1 and set before creating the production server
ELASTIC_IP_ALLOCATION_ID=
IPV6_ADDRESS=2600:1f15:2b3:e800::a17

INSTANCE_TYPE=t4g.micro
DISK_SIZE_GB=16
CREATE_NUM_DAILY_BACKUPS=7
# Created by authelia/create_iam_role.sh
IAM_INSTANCE_PROFILE_NAME=JaiaAuthServerInstanceProfile

# Packages for jaiabot-web-thirdparty (Authelia, LLDAP and Caddy as 3.y CloudHubs run them)
REPO=continuous
INDENTED_ROOT_PUBKEYS=$(sed 's/^/      /' ${SCRIPT_PATH}/../../../config/ssh/root_authorized_keys)

# Sites are auth., lldap., cc., sandbox.cc., launchpad. and data. under this domain
AUTH_BASE_DOMAIN=cloud.jaia.tech
# Empty for Let's Encrypt; https://acme-staging-v02.api.letsencrypt.org/directory while iterating
CADDY_ACME_CA=

AUTH_SMTP_ADDRESS=submission://smtp.postmarkapp.com:587
AUTH_SMTP_SENDER=noreply@auth.jaia.tech
AUTH_SMTP_CREDENTIALS_PARAMETER=/jaia/cloudhub/smtp_credentials

# WireGuard to the upstreams, which have no sign-in of their own: port 80 on them is
# reachable only through this tunnel. Addresses are in fd63:7ac0:9603::/64.
AUTH_WG_ADDRESS=fd63:7ac0:9603::1
AUTH_WG_PRIVATE_KEY_PARAMETER=/jaia/auth-server/${SERVER_NAME}/wireguard_private_key

# Filled in from the output of authelia/upstream-peer.sh
CC_DB_WG_ADDRESS=fd63:7ac0:9603::2
CC_DB_WG_ENDPOINT=2600:1f13:501:a400:546a:73cf:10af:9579
CC_DB_WG_PUBLIC_KEY=
CC_DB_SSH_HOST=184.34.82.222

DATA_WG_ADDRESS=fd63:7ac0:9603::3
DATA_WG_ENDPOINT=2600:1f13:501:a400:512:d470:42d7:6e98
DATA_WG_PUBLIC_KEY=
DATA_SSH_HOST=100.22.82.121

# cc_db and data run in AWS commercial
UPSTREAM_REGION=us-west-2
UPSTREAM_AWS_PROFILE=default

function create_security_group_rules()
{
    local SECURITY_GROUP_ID=$1
    for port in 22 80 443; do
        run "" aws ec2 authorize-security-group-ingress --group-id $SECURITY_GROUP_ID --ip-permissions IpProtocol=tcp,FromPort=$port,ToPort=$port,IpRanges='[{CidrIp=0.0.0.0/0}]',Ipv6Ranges='[{CidrIpv6=::/0}]'
        echo ">>>>>> Allowed TCP port $port on Security Group"
    done
}
