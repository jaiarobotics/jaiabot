INDENTED_ROOT_PUBKEYS=$(sed 's/^/      /' ${SCRIPT_PATH}/../../../config/ssh/root_authorized_keys)

function create_security_group_rules()
{
    local SECURITY_GROUP_ID=$1
    # Set Up Security Group Rules
    run "" aws ec2 authorize-security-group-ingress --group-id $SECURITY_GROUP_ID --ip-permissions IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges='[{CidrIp=0.0.0.0/0}]',Ipv6Ranges='[{CidrIpv6=::/0}]'
    echo ">>>>>> Allowed SSH (port 22) on Security Group"

    run "" aws ec2 authorize-security-group-ingress --group-id $SECURITY_GROUP_ID --ip-permissions IpProtocol=tcp,FromPort=443,ToPort=443,IpRanges='[{CidrIp=0.0.0.0/0}]',Ipv6Ranges='[{CidrIpv6=::/0}]'
    echo ">>>>>> Allowed HTTPS (port 443) on Security Group"

}
