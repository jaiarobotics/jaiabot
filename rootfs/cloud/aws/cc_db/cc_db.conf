DEBUG=true

ELASTIC_IP_ALLOCATION_ID=eipalloc-0dbdae688f7bce095

# Used to access from auth.cloud.jaia.tech
IPV6_ADDRESS=2600:1f13:501:a400:546a:73cf:10af:9579

ENABLE_TERMINATION_PROTECTION=false
SERVER_TYPE=cc_db
REPO=release
INDENTED_ROOT_PUBKEYS=$(sed 's/^/      /' ${SCRIPT_PATH}/../../../config/ssh/root_authorized_keys)
CREATE_NUM_DAILY_BACKUPS=7

# DB is a bit CPU heavy
INSTANCE_TYPE=t4g.small

function create_security_group_rules()
{
    local SECURITY_GROUP_ID=$1
    # Set Up Security Group Rules
    run "" aws ec2 authorize-security-group-ingress --group-id $SECURITY_GROUP_ID --ip-permissions IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges='[{CidrIp=0.0.0.0/0}]',Ipv6Ranges='[{CidrIpv6=::/0}]'
    echo ">>>>>> Allowed SSH (port 22) on Security Group"

    run "" aws ec2 authorize-security-group-ingress --group-id $SECURITY_GROUP_ID --ip-permissions IpProtocol=tcp,FromPort=80,ToPort=80,Ipv6Ranges='[{CidrIpv6=2600:1f13:501:a400:30b0:3e1b:d910:1412/128}]'
    echo ">>>>>> Allowed HTTP port 80 for auth.cloud.jaia.tech on Security Group"

}
