DEBUG=true

# No need for static IPv4 address
ELASTIC_IP_ALLOCATION_ID=

# Used to access from auth.cloud.jaia.tech
IPV6_ADDRESS=2600:1f13:501:a400:512:d470:42d7:6e98

ENABLE_TERMINATION_PROTECTION=false
SERVER_TYPE=data
REPO=release
INDENTED_ROOT_PUBKEYS=$(sed 's/^/      /' ${SCRIPT_PATH}/../../../config/ssh/root_authorized_keys)
CREATE_NUM_DAILY_BACKUPS=7

# t4g.small: more headroom than micro for JDV + S3 FUSE mount
INSTANCE_TYPE=t4g.small
DISK_SIZE_GB=16

# S3 bucket for centralized fleet data collection.
# Must already exist before running this script:
#   aws s3 mb s3://jaia--fleet-data --region us-east-1
DATA_BUCKET=jaia--fleet-data

# IAM instance profile granting s3 access to DATA_BUCKET.
# Must be created before running this script (see data-iam-policy.json.in):
#   1. aws iam create-policy --policy-name JaiaDataServerPolicy \
#         --policy-document file://data-iam-policy.json
#   2. aws iam create-role --role-name JaiaDataServerRole \
#         --assume-role-policy-document file://../cloudhub-trust-policy.json
#   3. aws iam attach-role-policy --role-name JaiaDataServerRole \
#         --policy-arn arn:aws:iam::<account-id>:policy/JaiaDataServerPolicy
#   4. aws iam create-instance-profile --instance-profile-name JaiaDataServerInstanceProfile
#   5. aws iam add-role-to-instance-profile \
#         --instance-profile-name JaiaDataServerInstanceProfile \
#         --role-name JaiaDataServerRole
IAM_INSTANCE_PROFILE_NAME=JaiaDataServerInstanceProfile

# IPv6 of auth.cloud.jaia.tech — restricts HTTP access on port 80 to the Caddy proxy only
AUTH_SERVER_IPV6=2600:1f13:501:a400:30b0:3e1b:d910:1412

function create_security_group_rules()
{
    local SECURITY_GROUP_ID=$1
    # SSH from anywhere (IPv4 + IPv6) — YubiKey-paired key, no password
    run "" aws ec2 authorize-security-group-ingress --group-id $SECURITY_GROUP_ID \
        --ip-permissions IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges='[{CidrIp=0.0.0.0/0}]',Ipv6Ranges='[{CidrIpv6=::/0}]'
    echo ">>>>>> Allowed SSH (port 22) on Security Group"

    # HTTP only from auth.cloud.jaia.tech (Caddy forward-auth reverse proxy)
    run "" aws ec2 authorize-security-group-ingress --group-id $SECURITY_GROUP_ID \
        --ip-permissions IpProtocol=tcp,FromPort=80,ToPort=80,Ipv6Ranges='[{CidrIpv6='"${AUTH_SERVER_IPV6}"'/128}]'
    echo ">>>>>> Allowed HTTP (port 80) from auth.cloud.jaia.tech on Security Group"
}
