# GPS time from gpsd, via NTP shared memory.
#
# gpsd assigns shared-memory units in the order devices are listed in
# /etc/default/gpsd, so unit 0 is the GPS feed and the contact feeds get 1-3.
#
# precision overrides the 0.5 s that gpsd reports for all in-band (non-PPS)
# time. There is no PPS on this hardware, so the achievable accuracy is set by
# the SPI poll interval and the hop through the driver and gpsd.
refclock SHM 0 refid GPS precision 1e-2 poll 3 filter 3 trust
