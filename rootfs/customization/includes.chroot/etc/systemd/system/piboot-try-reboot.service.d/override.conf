[Service]
# /boot/firmware is kept read-only at runtime to protect boot assets.
# piboot-try-reboot must write the state file,
# so remount it read-write before the service runs and read-only when done.
ExecStartPre=-/bin/mount -o remount,rw /boot/firmware
ExecStopPost=-/bin/mount -o remount,ro /boot/firmware
